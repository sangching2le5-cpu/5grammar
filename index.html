<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Grammar B1–B2 — Grammar Learning &amp; Practice</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --navy:#0f2744; --text:#1d3a5c; --muted:#5f7d9c;
  --primary:#4a86c8; --primary-d:#356ea9; --light:#e9f2fb; --lighter:#f5faff;
  --border:#d7e6f5; --bg:#f4f8fc; --white:#fff;
  --ok:#2f8f5b; --ok-bg:#e9f8f0; --bad:#c0453f; --bad-bg:#fdeceb;
  --warn:#9a6a10; --warn-bg:#fdf5e3;
  --radius:14px; --shadow:0 2px 10px rgba(20,60,110,.07);
}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{color:var(--navy);line-height:1.35;margin:0 0 .5em}
p{margin:0 0 .9em}
a{color:var(--primary-d)}
button{font-family:inherit;font-size:inherit;cursor:pointer}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky;top:0;z-index:300;background:var(--white);
  border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:14px;padding:9px 18px;min-height:60px;
}
.icon-btn{
  display:none;background:var(--light);border:1px solid var(--border);
  border-radius:10px;width:42px;height:42px;font-size:20px;color:var(--primary-d);
  line-height:1;flex:0 0 auto;
}
.brand{display:flex;flex-direction:column;line-height:1.25;flex:0 0 auto}
.brand-title{font-weight:700;color:var(--navy);letter-spacing:.4px;font-size:15px}
.brand-sub{font-size:12px;color:var(--muted)}
.search{position:relative;margin-left:auto;width:min(380px,45vw)}
.search input{
  width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;
  background:var(--lighter);color:var(--text);outline:none;font-size:14.5px;
}
.search input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(74,134,200,.14)}
.search-results{
  position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;
  border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 26px rgba(15,39,68,.13);
  max-height:60vh;overflow:auto;display:none;z-index:400;
}
.search-results.show{display:block}
.sr-item{padding:10px 14px;border-bottom:1px solid var(--lighter);cursor:pointer}
.sr-item:last-child{border-bottom:0}
.sr-item:hover{background:var(--lighter)}
.sr-item b{color:var(--primary-d);font-weight:600}
.sr-item small{display:block;color:var(--muted);font-size:12.5px}
.sr-empty{padding:14px;color:var(--muted);font-size:14px}

/* ---------- LAYOUT ---------- */
.layout{display:grid;grid-template-columns:288px minmax(0,1fr);max-width:1380px;margin:0 auto;align-items:start}
#sidebar{
  position:sticky;top:60px;max-height:calc(100vh - 60px);overflow-y:auto;
  background:var(--white);border-right:1px solid var(--border);
  padding:14px 12px 48px;
}
main{padding:26px 34px 90px;min-width:0}
.overlay{position:fixed;inset:0;background:rgba(15,39,68,.42);z-index:250;display:none}
.overlay.show{display:block}

/* ---------- SIDEBAR ---------- */
.nav-item{
  display:block;width:100%;text-align:left;background:transparent;border:0;
  border-radius:10px;padding:9px 12px;color:var(--text);font-size:14px;font-weight:600;
  letter-spacing:.3px;margin-bottom:2px;
}
.nav-item:hover{background:var(--lighter)}
.nav-item.active{background:var(--light);color:var(--primary-d)}
.side-group{margin:6px 0 10px}
.side-topic{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;
  border:0;border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:700;
  color:var(--navy);letter-spacing:.3px;
}
.side-topic:hover{background:var(--lighter)}
.side-topic.active{background:var(--light);color:var(--primary-d)}
.side-topic .num{color:var(--primary);font-weight:700}
.side-subs{padding-left:10px;border-left:2px solid var(--lighter);margin-left:14px}
.side-sub{
  display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:transparent;
  border:0;border-radius:8px;padding:6px 10px;font-size:13.3px;color:var(--muted);
}
.side-sub:hover{background:var(--lighter);color:var(--text)}
.side-sub.active{background:var(--light);color:var(--primary-d);font-weight:600}
.tick{color:var(--ok);font-size:12px;font-weight:700}
.side-sep{height:1px;background:var(--border);margin:12px 6px}
.side-label{font-size:11.5px;letter-spacing:1.2px;color:var(--muted);padding:4px 12px;font-weight:700}

/* ---------- COMMON ---------- */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.btn{
  display:inline-flex;align-items:center;gap:8px;border-radius:11px;border:1px solid var(--primary);
  background:var(--primary);color:#fff;padding:10px 18px;font-weight:600;font-size:14.5px;
  transition:background .15s,transform .1s;
}
.btn:hover{background:var(--primary-d);border-color:var(--primary-d)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--primary-d);border-color:var(--border)}
.btn.ghost:hover{background:var(--light)}
.btn.soft{background:var(--light);color:var(--primary-d);border-color:var(--light)}
.btn.danger{background:#fff;color:var(--bad);border-color:#f0c9c7}
.btn.danger:hover{background:var(--bad-bg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 13px;font-size:13.5px;border-radius:9px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}

.badge{display:inline-block;background:var(--light);color:var(--primary-d);border-radius:999px;
  padding:3px 12px;font-size:12px;font-weight:700;letter-spacing:.6px}
.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:12px}
.breadcrumb span{cursor:pointer}
.breadcrumb span:hover{color:var(--primary-d);text-decoration:underline}

/* ---------- HOME ---------- */
.hero{
  background:linear-gradient(135deg,#eaf3fc 0%,#f7fbff 60%,#ffffff 100%);
  border:1px solid var(--border);border-radius:18px;padding:34px 32px;margin-bottom:26px;
}
.hero h1{font-size:30px;letter-spacing:.4px;margin-bottom:6px}
.hero p{color:var(--muted);margin:0;font-size:15.5px}
.hero .pill{display:inline-block;margin-top:14px;background:#fff;border:1px solid var(--border);
  border-radius:999px;padding:5px 14px;font-size:12.5px;color:var(--primary-d);font-weight:600}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.tcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:#bcd8f0;transform:translateY(-2px)}
.tcard .num{font-size:13px;font-weight:800;color:var(--primary);letter-spacing:1.5px}
.tcard h3{font-size:17px;margin:0}
.tcard p{font-size:13.8px;color:var(--muted);margin:0;flex:1}
.tmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.bar{height:8px;background:var(--light);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#7fb1e3,#4a86c8);border-radius:99px;transition:width .3s}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.stat .v{font-size:24px;font-weight:800;color:var(--navy);line-height:1.2}
.stat .l{font-size:12.5px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;font-weight:600}
.stat .sub{font-size:12.5px;color:var(--muted)}

/* ---------- LESSON ---------- */
.sec-head{margin-bottom:18px}
.sec-head h2{font-size:25px;margin-bottom:8px}
.core{
  background:var(--light);border-left:4px solid var(--primary);border-radius:0 12px 12px 0;
  padding:13px 18px;font-weight:600;color:var(--navy);font-size:15px;
}
.blocks{margin-top:6px}
.bh{font-size:17.5px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.bul{margin:0 0 14px;padding-left:22px}
.bul li{margin-bottom:5px}
.box{border-radius:12px;padding:14px 18px;margin:14px 0;border:1px solid transparent}
.box-label{font-size:11.5px;font-weight:800;letter-spacing:1.1px;margin-bottom:6px}
.box p{margin:0 0 6px}
.box p:last-child{margin-bottom:0}
.box.rule{background:var(--light);border-color:#c9e0f6}
.box.rule .box-label{color:var(--primary-d)}
.box.note{background:#f2f7fd;border-color:#dbe9f8}
.box.note .box-label{color:#3d6f9e}
.box.warn{background:var(--warn-bg);border-color:#f0e0bb}
.box.warn .box-label{color:var(--warn)}
.box.rem{background:#f3f0fb;border-color:#e2ddf5}
.box.rem .box-label{color:#5a4aa0}
.box.ext{background:#eef8f5;border-color:#d3ece3}
.box.ext .box-label{color:#2c7a60}
.box.ex{background:var(--lighter);border-color:var(--border)}
.box.ex .box-label{color:var(--primary-d)}
.box.ex ul{margin:0;padding-left:20px}
.box.ex li{margin-bottom:5px}
table.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:14.3px;background:#fff;
  border:1px solid var(--border);border-radius:12px;overflow:hidden}
table.tbl th{background:var(--light);color:var(--navy);text-align:left;padding:10px 14px;font-size:13px;letter-spacing:.4px}
table.tbl td{padding:10px 14px;border-top:1px solid var(--border);vertical-align:top}
.tbl-wrap{overflow-x:auto}

.qc{background:#fff;border:1px dashed #bcd8f0;border-radius:12px;padding:16px 18px;margin-top:18px}
.qc h4{margin:0 0 10px;font-size:15px}
.opt{
  display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--border);
  border-radius:10px;padding:11px 15px;margin-bottom:8px;color:var(--text);font-size:14.6px;
  transition:background .12s,border-color .12s;
}
.opt:hover:not([disabled]){background:var(--lighter);border-color:#bcd8f0}
.opt[disabled]{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:#9fd9bb;color:#1d6b45;font-weight:600}
.opt.wrong{background:var(--bad-bg);border-color:#efc0be;color:#93332e;font-weight:600}
.opt.sel{border-color:var(--primary);background:var(--light)}
.feedback{border-radius:11px;padding:13px 16px;margin-top:12px;font-size:14.3px}
.feedback.ok{background:var(--ok-bg);border:1px solid #a9ddc4;color:#1d6b45}
.feedback.no{background:var(--bad-bg);border:1px solid #f0c8c6;color:#93332e}
.feedback b{color:inherit}
.feedback .rule-line{margin-top:8px;font-size:13.2px;opacity:.9}
.section-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding-top:20px;border-top:1px solid var(--border)}
.done-tag{color:var(--ok);font-weight:700;font-size:13.5px}

/* ---------- QUIZ ---------- */
.quiz-head{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px}
.quiz-head .qt{font-weight:700;color:var(--navy)}
.quiz-head .qm{font-size:13px;color:var(--muted);margin-bottom:8px}
.qcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px}
.qtext{font-size:16.5px;font-weight:600;color:var(--navy);margin-bottom:16px}
.qactions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.result-head{text-align:center;padding:22px}
.score-big{font-size:44px;font-weight:800;color:var(--primary-d);line-height:1.1}
.rev-item{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fff}
.rev-item .rq{font-weight:600;color:var(--navy);margin-bottom:8px}
.rev-item .line{font-size:14px;margin-bottom:4px}
.tag-ok{color:var(--ok);font-weight:700}
.tag-no{color:var(--bad);font-weight:700}

/* ---------- MISC ---------- */
.empty{text-align:center;color:var(--muted);padding:36px 20px}
.list-item{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.prog-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prog-row .name{width:190px;flex:0 0 auto;font-size:14px;font-weight:600}
.prog-row .bar{flex:1}
.prog-row .pct{width:46px;text-align:right;font-size:13.5px;color:var(--muted);font-weight:700}
.gloss{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.gloss .term{font-weight:700;color:var(--navy)}
.gloss .vi{font-size:14px;margin:4px 0}
.gloss .exm{font-size:13.5px;color:var(--muted);font-style:italic}

@media (max-width:900px){
  .icon-btn{display:inline-flex;align-items:center;justify-content:center}
  .layout{grid-template-columns:1fr}
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;width:288px;max-height:100%;
    transform:translateX(-103%);transition:transform .25s ease;z-index:260;
    box-shadow:0 0 30px rgba(15,39,68,.2);
  }
  #sidebar.open{transform:none}
  .brand-sub{display:none}
  .search{width:auto;flex:1;margin-left:0}
  main{padding:18px 15px 80px}
  .hero{padding:24px 20px}
  .hero h1{font-size:23px}
  .btn{padding:12px 18px}
  .prog-row .name{width:110px;font-size:13px}
  table.tbl{font-size:13.5px}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Mở menu">☰</button>
  <div class="brand">
    <span class="brand-title">ENGLISH GRAMMAR B1–B2</span>
    <span class="brand-sub">Grammar Learning &amp; Practice</span>
  </div>
  <div class="search">
    <input id="searchInput" type="search" placeholder="Search grammar..." autocomplete="off" aria-label="Search grammar">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<script>
/* =====================================================================
   1. LESSON DATA
   ===================================================================== */
const lessons = [
/* ================= TOPIC 1 — PREPOSITIONS ================= */
{
  id:"prepositions", num:"01", title:"Prepositions", viTitle:"Giới từ",
  desc:"Giới từ chỉ thời gian, vị trí, chuyển động, phương tiện; cụm cố định; noun / adjective / verb + preposition và preposition + V-ing.",
  review:[
    "at → thời điểm chính xác · on → ngày · in → khoảng thời gian dài",
    "for + khoảng thời gian · since + mốc thời gian",
    "by = hạn cuối · until = kéo dài đến",
    "on time = đúng giờ · in time = kịp lúc",
    "in = vị trí · into = chuyển động vào trong",
    "between = giữa các đối tượng riêng biệt · among = trong một nhóm",
    "at the station (điểm) · in the station (bên trong) · on the platform (bề mặt)",
    "Sau giới từ → V-ing: interested in learning, good at speaking",
    "Cụm cố định: at home · in fact · on purpose · by mistake",
    "Noun + prep: reason for · solution to · effect on",
    "Adj + prep: good at · afraid of · proud of · responsible for",
    "Verb + prep: listen to · depend on · look for · apply for"
  ],
  sections:[
  {
    id:"time", title:"Prepositions of Time",
    core:"AT → điểm thời gian · ON → ngày · IN → khoảng thời gian dài",
    blocks:[
      {t:"h", x:"1. AT — thời điểm cụ thể"},
      {t:"p", x:"Dùng <b>at</b> với một thời điểm chính xác."},
      {t:"ul", x:[
        "<b>at</b> + giờ: at 5 o'clock · at 7:30 · at midnight · at noon · at lunchtime",
        "<b>at</b> + một số thời điểm: at night · at the weekend · at Christmas · at Easter"
      ]},
      {t:"ex", x:["I usually get up <b>at 6 o'clock</b>.","We arrived <b>at midnight</b>."]},
      {t:"warn", x:"<b>at night</b> nhưng <b>in the morning / in the afternoon / in the evening</b>."},

      {t:"h", x:"2. ON — ngày và ngày cụ thể"},
      {t:"ul", x:[
        "Ngày trong tuần: on Monday · on Friday · on Sunday",
        "Ngày + tháng: on 15 May · on 25 December",
        "Ngày + một phần trong ngày: on Monday morning · on Friday evening",
        "Ngày đặc biệt: on my birthday · on New Year's Day"
      ]},
      {t:"ex", x:["I have an English class <b>on Monday</b>.","We met <b>on Friday evening</b>."]},

      {t:"h", x:"3. IN — khoảng thời gian dài hơn"},
      {t:"ul", x:[
        "Tháng: in January · in August",
        "Năm: in 2026 · in 1999",
        "Mùa: in summer · in winter",
        "Thập niên / thế kỷ: in the 1990s · in the 21st century",
        "Buổi trong ngày: in the morning · in the afternoon · in the evening"
      ]},
      {t:"ex", x:["I was born <b>in 2006</b>.","We usually study <b>in the evening</b>."]},

      {t:"h", x:"4. AT / ON / IN — so sánh nhanh"},
      {t:"tbl", head:["Giới từ","Dùng với","Ví dụ"], rows:[
        ["<b>at</b>","giờ / thời điểm","at 7:00"],
        ["<b>on</b>","ngày","on Monday"],
        ["<b>in</b>","tháng / năm / khoảng thời gian","in July, in 2026"]
      ]},
      {t:"rem", x:"<b>AT</b> → điểm thời gian · <b>ON</b> → ngày · <b>IN</b> → khoảng thời gian lớn."},

      {t:"h", x:"5. IN và WITHIN"},
      {t:"p", x:"Cả hai có thể nói về một khoảng thời gian tính từ hiện tại."},
      {t:"ul", x:[
        "<b>in</b> + khoảng thời gian = sau bao lâu nữa",
        "<b>within</b> + khoảng thời gian = không muộn hơn khoảng thời gian đó"
      ]},
      {t:"ex", x:[
        "I'll see you <b>in two hours</b>. → Tôi sẽ gặp bạn sau hai giờ nữa.",
        "Please reply <b>within two days</b>. → Hãy trả lời trong vòng hai ngày.",
        "I'll finish it <b>in two days</b>. → sau hai ngày",
        "I'll finish it <b>within two days</b>. → không muộn hơn hai ngày"
      ]},

      {t:"h", x:"6. FOR — khoảng thời gian kéo dài"},
      {t:"ul", x:["for two hours · for three days · for six months · for a long time"]},
      {t:"ex", x:["I have lived here <b>for three years</b>. → Tôi đã sống ở đây được ba năm."]},

      {t:"h", x:"7. SINCE — từ một thời điểm trong quá khứ đến hiện tại"},
      {t:"ul", x:["since 2020 · since Monday · since yesterday · since I was a child"]},
      {t:"ex", x:["I have lived here <b>since 2020</b>. → Tôi đã sống ở đây từ năm 2020."]},
      {t:"note", x:"<b>for + khoảng thời gian</b> (for five years) · <b>since + mốc thời gian</b> (since 2021)."},

      {t:"h", x:"8. FROM ... TO / UNTIL / TILL"},
      {t:"ex", x:[
        "I work <b>from Monday to Friday</b>.",
        "I'll wait <b>until 6 o'clock</b>.",
        "Wait <b>till</b> tomorrow. (until = till)"
      ]},

      {t:"h", x:"9. BY — không muộn hơn một thời điểm"},
      {t:"p", x:"<b>by + time</b> = trước hoặc vào đúng thời điểm đó."},
      {t:"ex", x:["Please finish the report <b>by Friday</b>. → trước hoặc vào thứ Sáu."]},
      {t:"warn", x:"<b>BY ≠ UNTIL</b>. <b>by Friday</b> = hạn cuối là thứ Sáu. <b>until Friday</b> = hành động tiếp tục kéo dài đến thứ Sáu."},
      {t:"ex", x:["I need to finish it <b>by Friday</b>.","I'll stay here <b>until Friday</b>."]},

      {t:"h", x:"10. ON TIME và IN TIME"},
      {t:"ul", x:[
        "<b>on time</b> = đúng giờ, đúng thời gian đã định",
        "<b>in time</b> = kịp lúc, trước khi quá muộn"
      ]},
      {t:"ex", x:[
        "The train arrived <b>on time</b>. → Xe lửa đến đúng giờ.",
        "We arrived <b>in time for the movie</b>.",

  {

      {t:"h", x:"7. ALONG — dọc theo"},

      {t:"h", x:"9. AROUND / ROUND — xung quanh"},

      {t:"h", x:"10. UP / DOWN"},
      {t:"ex", x:["He walked <b>up the stairs</b>.","They climbed <b>up the hill</b>.","She walked <b>down the stairs</b>.","They ran <b>down the hill</b>."]},

const glossary = [
  {term:"independent clause", vi:"Mệnh đề độc lập — có chủ ngữ, động từ và ý nghĩa hoàn chỉnh, có thể đứng một mình thành câu.", ex:"I study English."},
  {term:"dependent clause", vi:"Mệnh đề phụ thuộc — có chủ ngữ và động từ nhưng không thể đứng một mình.", ex:"because I was tired"},
  {term:"preposition", vi:"Giới từ — từ chỉ quan hệ thời gian, vị trí, hướng, phương tiện...", ex:"at, on, in, under, between"},
  {term:"particle", vi:"Tiểu từ — thành phần đi kèm động từ để tạo phrasal verb (thường là adverb hoặc preposition).", ex:"up trong give up, off trong turn off"},
  {term:"phrasal verb", vi:"Cụm động từ — động từ + particle, tạo thành nghĩa mới.", ex:"give up = từ bỏ"},
  {term:"gerund", vi:"Danh động từ — dạng V-ing hoạt động như danh từ.", ex:"Swimming is good exercise."},
  {term:"infinitive", vi:"Động từ nguyên mẫu có to.", ex:"to learn, to go"},
  {term:"bare infinitive", vi:"Động từ nguyên mẫu không có to.", ex:"make me study, let me go"},
  {term:"present participle", vi:"Phân từ hiện tại — dạng V-ing, dùng như tính từ hoặc trong cụm phân từ.", ex:"the man standing there"},
  {term:"past participle", vi:"Phân từ quá khứ — dạng V3/-ed, dùng trong bị động, thì hoàn thành, như tính từ.", ex:"the window broken yesterday"},
  {term:"participial clause", vi:"Mệnh đề phân từ — mệnh đề rút gọn bắt đầu bằng V-ing hoặc V3.", ex:"Walking home, I met John."},
  {term:"relative clause", vi:"Mệnh đề quan hệ — bổ sung thông tin cho một danh từ.", ex:"The woman who lives next door is a teacher."},
  {term:"noun clause", vi:"Mệnh đề danh từ — mệnh đề hoạt động như danh từ.", ex:"I don't know where he lives."},
  {term:"subordinator", vi:"Liên từ phụ thuộc — từ mở đầu mệnh đề phụ thuộc.", ex:"because, although, when, if"},
  {term:"coordinating conjunction", vi:"Liên từ kết hợp — nối hai mệnh đề độc lập (FANBOYS).", ex:"and, but, or, so"},
  {term:"fragment", vi:"Câu thiếu thành phần — nhóm từ không tạo thành câu hoàn chỉnh.", ex:"Because I was tired."},
  {term:"run-on sentence", vi:"Câu nối sai — hai mệnh đề độc lập nối mà không có dấu câu hay liên từ phù hợp.", ex:"I was tired I went home."},
  {term:"comma splice", vi:"Lỗi dùng dấu phẩy nối hai mệnh đề độc lập.", ex:"I was tired, I went home."}
];

/* =====================================================================
   3. STORAGE / STATE
   ===================================================================== */
const LS_KEY = "egram_b1b2_v1";

function blankStore(){
  return {
    completed:{},
    stats:{correct:0, incorrect:0},
    practice:{},
    mistakes:[],
    last:{view:"home"}
  };
}
let store = (function(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_KEY));
    if(raw && typeof raw === "object"){
      const b = blankStore();
      b.completed = raw.completed || {};
      b.stats = Object.assign({correct:0,incorrect:0}, raw.stats||{});
      b.practice = raw.practice || {};
      b.mistakes = Array.isArray(raw.mistakes) ? raw.mistakes : [];
      b.last = raw.last || {view:"home"};
      return b;
    }
  }catch(e){ /* ignore corrupted data */ }
  return blankStore();
})();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }

const state = {
  view:"home", topicId:null, sectionId:null,
  quiz:null, qc:null
};

/* =====================================================================
   4. HELPERS
   ===================================================================== */
const $ = id => document.getElementById(id);
const mainEl = $("main");
const sidebarEl = $("sidebar");

/* Escape HTML — an toàn cho text content */
function esc(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}
/* Letter A, B, C, D... cho đáp án */
function letter(i){ return String.fromCharCode(65 + i); }

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t = arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}
function findTopic(id){ return lessons.find(t=>t.id===id) || null; }
function findSection(topicId, sectionId){
  const t = findTopic(topicId);
  if(!t) return null;
  const s = t.sections.find(x=>x.id===sectionId);
  return s ? {topic:t, section:s} : null;
}
function secKey(topicId, sectionId){ return topicId + "/" + sectionId; }
function isDone(topicId, sectionId){ return !!store.completed[secKey(topicId,sectionId)]; }

function topicDone(topic){
  return topic.sections.filter(s=>isDone(topic.id, s.id)).length;
}
function topicPercent(topic){
  return Math.round(topicDone(t) / topic.sections.length * 100);
}
function totalSections(){ return lessons.reduce((a,t)=>a+t.sections.length,0); }
function totalDone(){ return lessons.reduce((a,t)=>a+topicDone(t),0); }
function overallPercent(){ return Math.round(totalDone()/totalSections()*100); }
function accuracy(){
  const s = store.stats;
  const tot = s.correct + s.incorrect;
  return tot ? Math.round(s.correct/tot*100) : 0;
}
function topicAccuracy(topicId){
  const p = store.practice[topicId];
  if(!p) return null;
  const tot = p.correct + p.incorrect;
  return tot ? Math.round(p.correct/tot*100) : null;
}
function allQuestionsOfTopic(topic){
  const out = [];
  topic.sections.forEach(s=>{
    (s.questions||[]).forEach(q=>{
      out.push(Object.assign({}, q, {
        topicId:topic.id, sectionId:s.id,
        topicTitle:topic.title, sectionTitle:s.title
      }));
    });
  });
  return out;
}

function renderSidebar(){
  let h = "";
  h += '<button class="nav-item '+(state.view==="home"?"active":"")+'" data-nav="home">HOME</button>';

  lessons.forEach(t=>{
    const active = state.topicId===t.id;
    h += '<div class="side-group">';
    h += '<button class="side-topic '+(active?"active":"")+'" data-nav="topic" data-topic="'+t.id+'">'+
         '<span class="num">'+t.num+'</span> '+esc(t.title.toUpperCase())+'</button>';
    h += '<div class="side-subs">';
    t.sections.forEach(s=>{
      const cls = (state.topicId===t.id && state.sectionId===s.id) ? "side-sub active" : "side-sub";
      const tick = isDone(t.id,s.id) ? '<span class="tick">✓</span>' : "";
      h += '<button class="'+cls+'" data-nav="section" data-topic="'+t.id+'" data-section="'+s.id+'">'+
           '<span>'+esc(s.title)+'</span>'+tick+'</button>';
    });
    h += '</div></div>';
  });

  h += '<div class="side-sep"></div>';
  h += '<div class="side-label">TOOLS</div>';
  h += '<button class="nav-item '+(state.view==="practice"?"active":"")+'" data-nav="practice">PRACTICE</button>';
  h += '<button class="nav-item '+(state.view==="progress"?"active":"")+'" data-nav="progress">PROGRESS</button>';
  h += '<button class="nav-item '+(state.view==="mistakes"?"active":"")+'" data-nav="mistakes">MISTAKES</button>';
  h += '<button class="nav-item '+(state.view==="glossary"?"active":"")+'" data-nav="glossary">MINI GLOSSARY</button>';
  sidebarEl.innerHTML = h;
}

   6. NAVIGATION
   ===================================================================== */
function closeMobileMenu(){
  sidebarEl.classList.remove("open");
  $("overlay").classList.remove("show");
}
function go(view, opts){
  opts = opts || {};
  /* Reset quiz state khi rời khỏi màn hình quiz */
  if(view !== "quiz") state.quiz = null;
  state.view = view;
  state.topicId = opts.topicId || null;
  state.sectionId = opts.sectionId || null;
  store.last = {view:view, topicId:state.topicId, sectionId:state.sectionId};
  save();
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function openTopic(topicId){ go("topic", {topicId:topicId}); }
function openSection(topicId, sectionId){
  state.qc = null;
  go("section", {topicId:topicId, sectionId:sectionId});
}

function render(){
  renderSidebar();
  if(state.view==="home") renderHome();
  else if(state.view==="topic") renderTopicPage();
  else if(state.view==="section") renderSectionPage();
  else if(state.view==="practice") renderPracticePage();
  else if(state.view==="quiz") renderQuiz();
  else if(state.view==="progress") renderProgressPage();
  else if(state.view==="mistakes") renderMistakesPage();
  else if(state.view==="glossary") renderGlossaryPage();
  else renderHome();
}

function renderBlocks(blocks){
  let h = "";
  blocks.forEach(b=>{
    if(b.t==="h") h += '<h3 class="bh">'+b.x+'</h3>';
    else if(b.t==="p") h += '<p>'+b.x+'</p>';
    else if(b.t==="ul") h += '<ul class="bul">'+b.x.map(i=>'<li>'+i+'</li>').join("")+'</ul>';
    else if(b.t==="ex") h += '<div class="box ex"><div class="box-label">📌 EXAMPLES</div><ul>'+b.x.map(i=>'<li>'+i+'</li>').join("")+'</ul></div>';
    else if(b.t==="rule") h += '<div class="box rule"><div class="box-label">✓ RULE</div><p>'+b.x+'</p></div>';
    else if(b.t==="note") h += '<div class="box note"><div class="box-label">💡 NOTE</div><p>'+b.x+'</p></div>';
    else if(b.t==="warn") h += '<div class="box warn"><div class="box-label">⚠ COMMON MISTAKE</div><p>'+b.x+'</p></div>';
    else if(b.t==="rem") h += '<div class="box rem"><div class="box-label">🧠 REMEMBER</div><p>'+b.x+'</p></div>';
    else if(b.t==="ext") h += '<div class="box ext"><div class="box-label">EXTENDED EXPLANATION</div><p>'+b.x+'</p></div>';
    else if(b.t==="tbl"){
      h += '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+b.head.map(c=>'<th>'+c+'</th>').join("")+'</tr></thead><tbody>';
      b.rows.forEach(r=>{ h += '<tr>'+r.map(c=>'<td>'+c+'</td>').join("")+'</tr>'; });

    }
  });

/* =====================================================================
   11. QUIZ ENGINE
   ===================================================================== */
function buildQuiz(rawQuestions, mode, title, meta){
  const prepared = shuffle(rawQuestions.slice()).map(q=>{
    const opts = q.o.map((text,i)=>({text:text, correct:i===q.a}));
    shuffle(opts);
    return {
      q:q.q, o:opts.map(x=>x.text), a:opts.findIndex(x=>x.correct),
      e:q.e, r:q.r,
      topicId:q.topicId, sectionId:q.sectionId,
      topicTitle:q.topicTitle, sectionTitle:q.sectionTitle
    };
  });
  return {
    mode:mode, title:title, meta:meta||"",
    questions:prepared,
    i:0,
    answers:new Array(prepared.length).fill(null),
    checked:false,
    finished:false
  };
}

function startTopicQuiz(topicId, mode){
  const t = findTopic(topicId);
  if(!t) return;
  const qs = allQuestionsOfTopic(t);
  if(!qs.length) return;
  state.quiz = buildQuiz(qs, mode||"practice", t.num+" — "+t.title, "topic");
  state.view = "quiz";
  store.last = {view:"practice"};
  save(); render(); window.scrollTo({top:0});
}
function startSectionQuiz(topicId, sectionId, mode){
  const f = findSection(topicId, sectionId);
  if(!f) return;
  if(!(f.section.questions||[]).length) return;
  const qs = f.section.questions.map(q=>Object.assign({},q,{
    topicId:topicId, sectionId:sectionId,
    topicTitle:f.topic.title, sectionTitle:f.section.title
  }));
  state.quiz = buildQuiz(qs, mode||"practice", f.topic.num+" · "+f.section.title, "section");
  state.view = "quiz";
  store.last = {view:"practice"};
  save(); render(); window.scrollTo({top:0});
}
function startMistakesQuiz(){
  if(!store.mistakes.length) return;
  const qs = store.mistakes.map(m=>({
    q:m.q, o:m.o.slice(), a:m.a, e:m.e, r:m.r,
    topicId:m.topicId, sectionId:m.sectionId,
    topicTitle:m.topicTitle, sectionTitle:m.sectionTitle
  }));
  state.quiz = buildQuiz(qs, "practice", "Mistakes Review", "mistakes");
  state.view = "quiz";
  render(); window.scrollTo({top:0});
}

function recordAnswer(q, userIndex){
  const correct = userIndex === q.a;
  store.stats.correct += correct ? 1 : 0;
  store.stats.incorrect += correct ? 0 : 1;
  if(q.topicId){
    if(!store.practice[q.topicId]) store.practice[q.topicId] = {correct:0, incorrect:0};
    store.practice[q.topicId].correct += correct ? 1 : 0;
    store.practice[q.topicId].incorrect += correct ? 0 : 1;
  }
  /* Key duy nhất cho mỗi câu để tránh ghi đè khi trùng text giữa các topic */
  const key = (q.topicId||"") + "::" + (q.sectionId||"") + "::" + q.q;
  if(correct){
    const idx = store.mistakes.findIndex(m=>((m.topicId||"")+"::"+(m.sectionId||"")+"::"+m.q) === key);
    if(idx >= 0) store.mistakes.splice(idx,1);
  }else{
    const existing = store.mistakes.find(m=>((m.topicId||"")+"::"+(m.sectionId||"")+"::"+m.q) === key);
    const entry = {
      q:q.q, o:q.o.slice(), a:q.a, user:userIndex,
      e:q.e, r:q.r,
      topicId:q.topicId, sectionId:q.sectionId,
      topicTitle:q.topicTitle, sectionTitle:q.sectionTitle
    };
    if(existing) Object.assign(existing, entry);
    else store.mistakes.push(entry);
  }
  save();
}

function renderQuiz(){
  const q = state.quiz;
  if(!q){ state.view="practice"; return render(); }
  if(q.finished) return renderQuizResult();

  const cur = q.questions[q.i];
  const chosen = q.answers[q.i];
  const total = q.questions.length;
  const pct = Math.round((q.i)/total*100);

  let h = "";
  h += '<div class="quiz-head">';
  h += '<div class="qt">'+esc(q.title)+'</div>';
  h += '<div class="qm">'+(q.mode==="practice"?"PRACTICE MODE — xem đáp án sau mỗi câu":"TEST MODE — đáp án hiện ở cuối bài")+
       ' · Question '+(q.i+1)+' / '+total+'</div>';
  h += '<div class="bar"><i style="width:'+pct+'%"></i></div>';
  h += '</div>';

  h += '<div class="qcard">';
  h += '<p class="qtext">'+(q.i+1)+'. '+cur.q+'</p>';
  h += '<div class="opts">';
  cur.o.forEach((opt,i)=>{
    let cls = "opt";
    if(q.mode==="practice" && q.checked){
      if(i===cur.a) cls += " correct";
      else if(i===chosen) cls += " wrong";
    }else if(chosen===i){
      cls += " sel";
    }
    const dis = (q.mode==="practice" && q.checked) ? " disabled" : "";
    h += '<button class="'+cls+'" data-act="qopt" data-i="'+i+'"'+dis+'>'+letter(i)+'. '+opt+'</button>';
  });
  h += '</div>';

  if(q.mode==="practice" && q.checked){
    const ok = chosen === cur.a;
    h += '<div class="feedback '+(ok?"ok":"no")+'">'+
         (ok ? '<b>✓ Đúng!</b>' : '<b>✗ Sai.</b> Đáp án đúng: <b>'+letter(cur.a)+'. '+cur.o[cur.a]+'</b>')+
         '<div style="margin-top:6px">'+cur.e+'</div>'+
         '<div class="rule-line"><b>Rule:</b> '+cur.r+'</div></div>';
  }

  h += '<div class="qactions">';
  if(q.mode==="practice"){
    if(!q.checked){
      h += '<button class="btn" data-act="quiz-check"'+(chosen===null?" disabled":"")+'>Check Answer</button>';
    }else{
      if(q.i < total-1) h += '<button class="btn" data-act="quiz-next">Next Question</button>';
      else h += '<button class="btn" data-act="quiz-finish">Xem kết quả</button>';
    }
  }else{
    h += '<button class="btn" data-act="quiz-next"'+(chosen===null?" disabled":"")+'>'+(q.i<total-1?"Next Question":"Finish Test")+'</button>';
  }
  h += '<button class="btn ghost" data-act="quiz-quit">Thoát</button>';
  h += '</div></div>';

  mainEl.innerHTML = h;
}

function renderQuizResult(){
  const q = state.quiz;
  let correct = 0;
  q.questions.forEach((item,i)=>{ if(q.answers[i]===item.a) correct++; });
  const total = q.questions.length;
  const incorrect = total - correct;
  const pct = Math.round(correct/total*100);

  let h = "";
  h += '<div class="card result-head">';
  h += '<div class="badge">RESULT</div>';
  h += '<h2 style="margin-top:10px">'+esc(q.title)+'</h2>';
  h += '<div class="score-big">'+pct+'%</div>';
  h += '<p style="color:var(--muted)">'+correct+' correct · '+incorrect+' incorrect · '+total+' questions</p>';
  h += '<div class="bar" style="max-width:420px;margin:12px auto"><i style="width:'+pct+'%"></i></div>';
  h += '<div class="row" style="justify-content:center;margin-top:14px">';
  h += '<button class="btn" data-act="quiz-retry">Làm lại</button>';
  h += '<button class="btn ghost" data-act="quiz-quit">Về trang Practice</button>';
  h += '<button class="btn ghost" data-act="home">Về trang chủ</button>';
  h += '</div></div>';

  h += '<h3 class="bh">Chi tiết &amp; giải thích</h3>';
  q.questions.forEach((item,i)=>{
    const ua = q.answers[i];
    const ok = ua === item.a;
    h += '<div class="rev-item">';
    h += '<div class="rq">'+(i+1)+'. '+item.q+'</div>';
    h += '<div class="line">Bạn chọn: <span class="'+(ok?"tag-ok":"tag-no")+'">'+(ua===null?"(không trả lời)":letter(ua)+'. '+item.o[ua])+'</span></div>';

    h += '<div class="line" style="color:var(--muted)">'+item.e+'</div>';
    h += '<div class="line" style="font-size:13px;color:var(--muted)"><b>Rule:</b> '+item.r+'</div>';
    h += '</div>';
  });

  mainEl.innerHTML = h;
}

  glossary.forEach(g=>{
    h += '<div class="gloss">';
    h += '<div class="term">'+esc(g.term)+'</div>';
    h += '<div class="vi">'+esc(g.vi)+'</div>';
    h += '<div class="exm">Example: '+esc(g.ex)+'</div>';
    h += '</div>';
  });
  mainEl.innerHTML = h;
}

/* =====================================================================
   15. SEARCH
   ===================================================================== */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  lessons.forEach(t=>{
    t.sections.forEach(s=>{
      let text = s.title+" "+s.core+" ";
      s.blocks.forEach(b=>{
        if(b.t==="tbl"){
          text += b.head.join(" ")+" ";
          b.rows.forEach(r=>{ text += r.join(" ")+" "; });
        }else if(Array.isArray(b.x)){
          text += b.x.join(" ")+" ";
        }else{
          text += b.x+" ";
        }
      });
      text += (s.questions||[]).map(q=>q.q+" "+q.o.join(" ")).join(" ");
      searchIndex.push({
        topicId:t.id, sectionId:s.id,
        title:s.title, topicTitle:t.title,
        text:text.replace(/<[^>]+>/g," ").toLowerCase()
      });
    });
  });
  glossary.forEach(g=>{
    searchIndex.push({
      topicId:null, sectionId:null,
      title:"Glossary: "+g.term, topicTitle:"Mini Glossary",
      text:(g.term+" "+g.vi+" "+g.ex).toLowerCase()
    });
  });
  return searchIndex;
}

function doSearch(query){
  const box = $("searchResults");
  const q = query.trim().toLowerCase();
  if(q.length < 2){ box.classList.remove("show"); box.innerHTML=""; return; }
  const idx = buildSearchIndex();
  const results = idx.filter(item=>item.text.indexOf(q) !== -1).slice(0,12);
  if(!results.length){
    box.innerHTML = '<div class="sr-empty">Không tìm thấy kết quả cho “'+esc(query)+'”.</div>';
    box.classList.add("show");
    return;
  }
  box.innerHTML = results.map((r,i)=>{
    const pos = r.text.indexOf(q);
    const from = Math.max(0, pos-45);
    let snippet = r.text.substring(from, pos+75);
    /* bỏ hẳn các dấu < > còn sót (nếu có) */
    snippet = snippet.replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return '<div class="sr-item" data-sr="'+i+'" data-topic="'+(r.topicId||"")+'" data-section="'+(r.sectionId||"")+'">'+
           '<b>'+esc(r.title)+'</b><small>'+esc(r.topicTitle)+' — …'+snippet+'…</small></div>';
  }).join("");
  box.classList.add("show");
}

/* =====================================================================
   16. EVENTS
   ===================================================================== */
/* Sidebar navigation */
sidebarEl.addEventListener("click", function(e){
  const btn = e.target.closest("[data-nav]");
  if(!btn) return;
  const nav = btn.dataset.nav;
  if(nav==="home") go("home");
  else if(nav==="topic") openTopic(btn.dataset.topic);
  else if(nav==="section") openSection(btn.dataset.topic, btn.dataset.section);
  else if(nav==="practice") go("practice");
  else if(nav==="progress") go("progress");
  else if(nav==="mistakes") go("mistakes");
  else if(nav==="glossary") go("glossary");
  closeMobileMenu();
});

/* Main actions */
mainEl.addEventListener("click", function(e){
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  const topicId = el.dataset.topic;
  const sectionId = el.dataset.section;

  if(act==="home"){ go("home"); return; }
  if(act==="open-topic"){ openTopic(topicId); return; }
  if(act==="open-section"){ openSection(topicId, sectionId); return; }

  if(act==="mark-complete"){
    const k = secKey(topicId, sectionId);
    if(store.completed[k]) delete store.completed[k];
    else store.completed[k] = true;
    save(); renderSectionPage(); renderSidebar();
    return;
  }

  if(act==="qc-opt"){
    const key = secKey(topicId, sectionId);
    if(state.qc && state.qc.key === key) return;
    state.qc = {key:key, chosen:parseInt(el.dataset.i,10)};
    const f = findSection(topicId, sectionId);
    if(f) $("qcBox").innerHTML = quickCheckHTML(f.topic, f.section);
    return;
  }

  if(act==="start-topic-quiz"){ startTopicQuiz(topicId, "practice"); return; }
  if(act==="start-topic-test"){ startTopicQuiz(topicId, "test"); return; }
  if(act==="start-section-quiz"){ startSectionQuiz(topicId, sectionId, "practice"); return; }

  /* ---- quiz ---- */
  const q = state.quiz;
  if(act==="qopt"){
    if(!q) return;
    if(q.mode==="practice" && q.checked) return;
    q.answers[q.i] = parseInt(el.dataset.i,10);
    renderQuiz();
    return;
  }
  if(act==="quiz-check"){
    if(!q || q.answers[q.i]===null) return;
    q.checked = true;
    recordAnswer(q.questions[q.i], q.answers[q.i]);
    renderQuiz();
    return;
  }
  if(act==="quiz-next"){
    if(!q) return;
    if(q.answers[q.i]===null) return;
    if(q.mode==="test") recordAnswer(q.questions[q.i], q.answers[q.i]);
    if(q.i < q.questions.length-1){
      q.i++;
      q.checked = false;
      renderQuiz();
      window.scrollTo({top:0, behavior:"smooth"});
    }else{
      q.finished = true;
      renderQuiz();
      window.scrollTo({top:0, behavior:"smooth"});
    }
    return;
  }
  if(act==="quiz-finish"){
    if(!q) return;
    q.finished = true;
    renderQuiz();
    window.scrollTo({top:0, behavior:"smooth"});
    return;
  }
  if(act==="quiz-retry"){
    if(!q) return;
    if(q.meta==="mistakes"){ startMistakesQuiz(); }
    else{
      const sameMode = q.mode;
      if(q.meta==="topic"){
        const t = findTopic(q.questions[0].topicId);
        if(t) startTopicQuiz(t.id, sameMode);
      }else if(q.meta==="section"){
        const first = q.questions[0];
        startSectionQuiz(first.topicId, first.sectionId, sameMode);
      }else{
        go("practice");
      }
    }
    return;
  }
  if(act==="quiz-quit"){
    state.quiz = null;
    go("practice");
    return;
  }

  /* ---- mistakes ---- */
  if(act==="mistakes-practice"){ startMistakesQuiz(); return; }
  if(act==="clear-mistakes"){
    if(window.confirm("Xoá toàn bộ danh sách câu trả lời sai?")){
      store.mistakes = [];
      save(); renderMistakesPage();
    }
    return;
  }

  /* ---- reset ---- */
  if(act==="reset-progress"){
    if(window.confirm("Bạn có chắc muốn xoá toàn bộ tiến độ học tập, điểm bài tập và danh sách lỗi sai? Hành động này không thể hoàn tác.")){
      store = blankStore();
      save();
      state.quiz = null;
      go("home");
    }
    return;
  }
});

/* Search */
const searchInput = $("searchInput");
const searchResults = $("searchResults");
searchInput.addEventListener("input", function(){ doSearch(this.value); });
searchInput.addEventListener("focus", function(){ if(this.value.trim().length>=2) doSearch(this.value); });
document.addEventListener("click", function(e){
  if(!e.target.closest(".search")) searchResults.classList.remove("show");
});
searchResults.addEventListener("click", function(e){
  const item = e.target.closest(".sr-item");
  if(!item) return;
  const topicId = item.dataset.topic;
  const sectionId = item.dataset.section;
  searchResults.classList.remove("show");
  searchInput.value = "";
  if(topicId && sectionId) openSection(topicId, sectionId);
  else go("glossary");
});

/* Mobile menu */
$("menuBtn").addEventListener("click", function(){
  sidebarEl.classList.toggle("open");
  $("overlay").classList.toggle("show");
});
$("overlay").addEventListener("click", closeMobileMenu);

/* =====================================================================
   17. INIT
   ===================================================================== */
(function init(){
  const last = store.last || {view:"home"};
  if(last.view === "section" && last.topicId && last.sectionId && findSection(last.topicId, last.sectionId)){
    state.view = "section"; state.topicId = last.topicId; state.sectionId = last.sectionId;
  }else if(last.view === "topic" && findTopic(last.topicId)){
    state.view = "topic"; state.topicId = last.topicId;
  }else if(["home","practice","progress","mistakes","glossary"].indexOf(last.view) !== -1){
    state.view = last.view;
  }else{
    state.view = "home";
  }
  render();
})();
</script>
