<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Grammar B1–B2 — Interactive Digital Grammar Book</title>
<style>
/* ============ RESET & TOKENS ============ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;

  --ink:#17283a; --ink-2:#2e4459; --ink-3:#5d7386; --muted:#8698a7;
  --paper:#f6f1e8; --paper-2:#fbf8f2; --card:#fffdf9;
  --line:#e7ddcb; --line-2:#d6c8b0;
  --brand:#1c4a6a; --brand-2:#2c6b8f; --brand-soft:#e4eef5;
  --gold:#a97a1e; --gold-soft:#f4ead2;
  --ok:#2f7d4e; --ok-bg:#e6f3ea;
  --bad:#a83a2e; --bad-bg:#fbe9e5;
  --warn:#8a5a00; --warn-bg:#fbf3de;
  --radius:14px; --radius-lg:20px;
  --shadow:0 2px 14px rgba(30,60,90,.06);
  --shadow-lg:0 8px 30px rgba(30,60,90,.12);
  --content-max:820px;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif);color:var(--ink);line-height:1.28;margin:0 0 .5em;letter-spacing:-.01em}
p{margin:0 0 .95em}
a{color:var(--brand-2);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky;top:0;z-index:300;background:rgba(255,253,249,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 20px;min-height:62px;
  position:sticky;
}
.icon-btn{
  display:none;background:var(--brand-soft);border:1px solid var(--line);
  border-radius:10px;width:42px;height:42px;font-size:20px;color:var(--brand-2);
  align-items:center;justify-content:center;flex:0 0 auto;
}
.brand{display:flex;flex-direction:column;line-height:1.2;flex:0 0 auto}
.brand-title{font-family:var(--serif);font-weight:700;color:var(--ink);letter-spacing:.2px;font-size:15.5px}
.brand-sub{font-size:11.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.search{position:relative;margin-left:auto;width:min(380px,45vw)}
.search input{
  width:100%;padding:9px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper-2);color:var(--ink);outline:none;font-size:14.5px;
  font-family:var(--sans);
}
.search input:focus{border-color:var(--brand-2);background:#fff;box-shadow:0 0 0 3px rgba(44,107,143,.15)}
.search-results{
  position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);
  max-height:60vh;overflow:auto;display:none;z-index:400;
}
.search-results.show{display:block}
.sr-item{padding:11px 14px;border-bottom:1px solid #f4f0e8;cursor:pointer}
.sr-item:last-child{border-bottom:0}
.sr-item:hover{background:var(--paper-2)}
.sr-item b{color:var(--brand);font-weight:600;font-family:var(--serif)}
.sr-item small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sr-empty{padding:14px;color:var(--muted);font-size:14px}

/* Reading progress bar */
.read-track{
  position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent;
  overflow:hidden;pointer-events:none;
}
.read-bar{height:100%;width:0;background:linear-gradient(90deg,var(--brand-2),var(--gold));transition:width .12s linear}

/* ============ LAYOUT ============ */
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1400px;margin:0 auto;align-items:start}
#sidebar{
  position:sticky;top:62px;max-height:calc(100vh - 62px);overflow-y:auto;
  background:var(--paper-2);border-right:1px solid var(--line);
  padding:22px 16px 60px;
}
#sidebar::-webkit-scrollbar{width:8px}
#sidebar::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
main{padding:38px 48px 120px;min-width:0}
.overlay{position:fixed;inset:0;background:rgba(23,40,58,.5);z-index:250;display:none;backdrop-filter:blur(2px)}
.overlay.show{display:block}

/* ============ SIDEBAR (Table of Contents) ============ */
.toc-label{font-family:var(--serif);font-size:11.5px;letter-spacing:2px;color:var(--gold);font-weight:700;
  padding:6px 12px;text-transform:uppercase;margin-bottom:4px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:0;border-radius:10px;padding:9px 12px;
  color:var(--ink-2);font-size:13.5px;font-weight:600;letter-spacing:.2px;margin-bottom:2px;
}
.nav-item:hover{background:rgba(28,74,106,.06)}
.nav-item.active{background:var(--brand-soft);color:var(--brand)}
.side-group{margin:6px 0 12px}
.side-topic{
  display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:transparent;
  border:0;border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:700;
  color:var(--ink);font-family:var(--serif);
}
.side-topic:hover{background:rgba(28,74,106,.06)}
.side-topic.active{background:var(--brand-soft);color:var(--brand)}
.side-topic .num{color:var(--gold);font-family:var(--serif);font-weight:700;font-size:12.5px;padding-top:1px;letter-spacing:.5px}
.side-topic .tx{flex:1;line-height:1.35}
.side-subs{padding-left:16px;border-left:2px solid var(--line);margin-left:22px;margin-top:2px}
.side-sub{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:transparent;border:0;border-radius:8px;padding:6px 10px;
  font-size:13px;color:var(--ink-3);line-height:1.4;
}
.side-sub:hover{background:rgba(28,74,106,.05);color:var(--ink)}
.side-sub.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.tick{color:var(--ok);font-size:11px;font-weight:800;flex:0 0 auto}
.side-sep{height:1px;background:var(--line);margin:14px 8px}
.side-label{font-family:var(--serif);font-size:11px;letter-spacing:1.8px;color:var(--gold);
  padding:4px 12px 8px;font-weight:700;text-transform:uppercase}

/* ============ COMMON ============ */
.btn{
  display:inline-flex;align-items:center;gap:8px;border-radius:11px;border:1px solid var(--brand);
  background:var(--brand);color:#fff;padding:10px 18px;font-weight:600;font-size:14px;
  transition:background .15s,transform .1s,border-color .15s;
}
.btn:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--brand);border-color:var(--line)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{background:#fff;color:var(--bad);border-color:#e8c4bf}
.btn.danger:hover{background:var(--bad-bg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:9px}
.btn-link{background:none;border:0;padding:6px 10px;border-radius:8px;font-size:13px;
  color:var(--brand-2);font-weight:600}
.btn-link:hover{background:var(--brand-soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.badge{display:inline-block;background:var(--gold-soft);color:var(--gold);border-radius:999px;
  padding:3px 12px;font-size:11.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  font-family:var(--serif)}
.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:18px;font-family:var(--serif);letter-spacing:.2px}
.breadcrumb span{cursor:pointer;transition:color .12s}
.breadcrumb span:hover{color:var(--brand);text-decoration:underline}
.breadcrumb .sep{margin:0 6px;opacity:.5}

/* ============ HOME (Cover) ============ */
.cover{
  position:relative;
  background:
    radial-gradient(1200px 300px at 20% -10%, #eaf1f7 0%, transparent 60%),
    linear-gradient(180deg,#fffdf9 0%,#f9f4ea 100%);
  border:1px solid var(--line);border-radius:24px;
  padding:60px 54px 50px;margin-bottom:34px;
  box-shadow:var(--shadow-lg);
  overflow:hidden;
}
.cover::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:8px;
  background:linear-gradient(180deg,var(--brand) 0%,var(--gold) 100%);
}
.cover::after{
  content:"";position:absolute;right:-40px;bottom:-40px;width:220px;height:220px;
  background:radial-gradient(circle,rgba(169,122,30,.09) 0%,transparent 70%);
  border-radius:50%;
}
.cover-eyebrow{font-family:var(--serif);font-size:12px;letter-spacing:3px;
  color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:16px}
.cover h1{font-size:clamp(30px,4.4vw,48px);line-height:1.08;letter-spacing:-.02em;
  margin-bottom:14px;max-width:680px}
.cover h1 em{font-style:italic;color:var(--brand-2)}
.cover-lead{font-size:16.5px;color:var(--ink-3);max-width:620px;margin-bottom:26px;line-height:1.65}
.cover-meta{display:flex;flex-wrap:wrap;gap:26px;padding-top:22px;border-top:1px solid var(--line);margin-top:12px}
.cover-meta .m-item{display:flex;flex-direction:column;gap:2px}
.cover-meta .m-val{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink);line-height:1.1}
.cover-meta .m-lb{font-size:11.5px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;font-weight:700}

.toc-section-title{
  display:flex;align-items:baseline;gap:14px;margin:0 0 20px;
}
.toc-section-title h2{font-size:22px;margin:0;letter-spacing:-.01em}
.toc-section-title .rule{flex:1;height:1px;background:var(--line)}

.chapter-grid{display:grid;grid-template-columns:1fr;gap:16px}
.chapter-card{
  display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:22px 26px;transition:all .18s;text-align:left;cursor:pointer;font-family:inherit;
  color:inherit;width:100%;
}
.chapter-card:hover{border-color:var(--brand-2);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.chapter-card .ch-num{
  font-family:var(--serif);font-size:44px;font-weight:700;color:var(--gold);
  line-height:.9;letter-spacing:-.03em;min-width:70px;
}
.chapter-card .ch-body{min-width:0}
.chapter-card .ch-en{
  font-family:var(--serif);font-size:11.5px;letter-spacing:2px;
  color:var(--brand);font-weight:700;text-transform:uppercase;margin-bottom:4px;
}
.chapter-card .ch-vi{font-family:var(--serif);font-size:22px;color:var(--ink);margin-bottom:6px;line-height:1.2}
.chapter-card .ch-desc{font-size:13.8px;color:var(--ink-3);margin:0;line-height:1.55;max-width:640px}
.chapter-card .ch-arrow{
  font-size:22px;color:var(--brand-2);font-family:var(--serif);
  transition:transform .18s;flex:0 0 auto;
}
.chapter-card:hover .ch-arrow{transform:translateX(4px)}
.chapter-card .ch-progress{
  margin-top:10px;display:flex;align-items:center;gap:12px;
}
.ch-progress .bar{height:6px;flex:1;max-width:240px}
.ch-progress .pct{font-size:12px;color:var(--muted);font-weight:700;font-family:var(--serif)}

/* ============ TOPIC PAGE (Chapter landing) ============ */
.chapter-head{
  margin-bottom:34px;
  padding-bottom:26px;border-bottom:2px solid var(--line);
}
.chapter-head .ch-kicker{font-family:var(--serif);font-size:12px;letter-spacing:3px;
  color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:10px}
.chapter-head h1{font-size:clamp(28px,3.6vw,40px);letter-spacing:-.02em;line-height:1.1;margin-bottom:10px}
.chapter-head .ch-vi{font-family:var(--serif);font-size:20px;color:var(--brand-2);font-style:italic;margin-bottom:14px}
.chapter-head .ch-desc{font-size:15.5px;color:var(--ink-3);max-width:700px;line-height:1.65}

.review-panel{
  background:linear-gradient(180deg,#fefbf5,#fbf6ec);
  border:1px solid var(--line);border-left:4px solid var(--gold);
  border-radius:0 14px 14px 0;padding:20px 26px;margin-bottom:32px;
}
.review-panel h3{font-size:14px;letter-spacing:2px;text-transform:uppercase;
  color:var(--gold);font-family:var(--sans);font-weight:800;margin-bottom:12px}
.review-panel ul{margin:0;padding-left:22px}
.review-panel li{margin-bottom:6px;font-size:14.5px;color:var(--ink-2);line-height:1.55}

.lessons-list{margin:0;padding:0;list-style:none}
.lesson-row{
  display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;
  padding:18px 4px;border-bottom:1px solid var(--line);
  background:transparent;border-left:0;border-right:0;border-top:0;
  text-align:left;width:100%;font-family:inherit;color:inherit;cursor:pointer;
  transition:background .15s;border-radius:8px;
}
.lesson-row:hover{background:var(--paper-2)}
.lesson-row:last-child{border-bottom:0}
.lesson-row .l-num{
  font-family:var(--serif);font-size:22px;color:var(--gold);
  font-weight:700;min-width:44px;line-height:1;letter-spacing:-.02em;
}
.lesson-row .l-body{min-width:0}
.lesson-row .l-title{font-family:var(--serif);font-size:17.5px;color:var(--ink);margin-bottom:4px;line-height:1.3;display:flex;align-items:center;gap:10px}
.lesson-row .l-lead{font-size:13.5px;color:var(--ink-3);line-height:1.55;margin:0}
.lesson-row .l-side{display:flex;align-items:center;gap:12px;color:var(--brand-2);font-family:var(--serif)}
.lesson-row .l-side .arrow{font-size:18px;transition:transform .15s}
.lesson-row:hover .l-side .arrow{transform:translateX(4px)}

/* ============ SECTION PAGE (Reading) ============ */
.reading-shell{max-width:var(--content-max);margin:0 auto}

.reading-head{margin-bottom:34px;padding-bottom:22px;border-bottom:2px solid var(--line)}
.reading-head .rh-meta{
  display:flex;align-items:center;gap:14px;margin-bottom:14px;
  font-family:var(--serif);font-size:12px;letter-spacing:2px;
  color:var(--gold);font-weight:700;text-transform:uppercase;
}
.reading-head .rh-meta .divider{width:32px;height:1px;background:var(--line-2);opacity:.7}
.reading-head h1{font-size:clamp(28px,3.6vw,40px);letter-spacing:-.02em;line-height:1.1;margin-bottom:14px}
.reading-head .rh-core{
  font-family:var(--serif);font-size:17px;color:var(--brand);line-height:1.55;
  padding:14px 20px;border-left:3px solid var(--gold);
  background:linear-gradient(90deg,rgba(244,234,210,.5),rgba(244,234,210,0));
  border-radius:0 8px 8px 0;
}
.reading-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center}
.reading-actions .hint{font-size:12.5px;color:var(--muted);margin-left:auto;font-family:var(--serif);font-style:italic}

/* ---- Concept card (collapsible) ---- */
.concepts{margin:8px 0 40px}
.concept{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:12px;
  overflow:hidden;transition:box-shadow .18s,border-color .18s;
}
.concept.open{border-color:var(--line-2);box-shadow:var(--shadow)}
.concept-head{
  display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;
  width:100%;text-align:left;background:transparent;border:0;
  padding:18px 22px;font-family:inherit;color:inherit;
  transition:background .15s;
}
.concept-head:hover{background:rgba(28,74,106,.03)}
.concept-num{
  font-family:var(--serif);font-size:14px;font-weight:700;
  color:var(--gold);letter-spacing:1px;padding-top:2px;
}
.concept-main{min-width:0}
.concept-title{
  display:block;font-family:var(--serif);font-size:17px;color:var(--ink);
  line-height:1.35;margin-bottom:2px;
}
.concept-preview{
  display:block;font-size:13.5px;color:var(--muted);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:100%;
}
.concept.open .concept-preview{display:none}
.concept-toggle{
  position:relative;width:22px;height:22px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  color:var(--brand-2);transition:transform .3s;
}
.concept-toggle::before,
.concept-toggle::after{
  content:"";position:absolute;background:currentColor;border-radius:1px;
  transition:transform .25s, opacity .2s;
}
.concept-toggle::before{width:12px;height:2px}
.concept-toggle::after{width:2px;height:12px}
.concept.open .concept-toggle{transform:rotate(90deg)}
.concept.open .concept-toggle::after{opacity:0;transform:scaleY(0)}
.concept-body{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .34s cubic-bezier(.4,.2,.2,1);
}
.concept.open .concept-body{grid-template-rows:1fr}
.concept-body-inner{
  overflow:hidden;min-height:0;
  padding:0 22px 24px;
}
.concept.open .concept-body-inner{
  padding-top:2px;border-top:1px solid var(--line);margin-top:2px;
}
.concept-body-inner > .bh:first-child{margin-top:16px}

/* ---- Theory blocks ---- */
.bh{font-family:var(--serif);font-size:16px;margin:24px 0 10px;padding:0;
  color:var(--ink);letter-spacing:-.005em}
.bh::before{display:none}
.bul{margin:0 0 14px;padding-left:24px}
.bul li{margin-bottom:5px;line-height:1.65}
.box{border-radius:10px;padding:13px 18px;margin:14px 0;border:1px solid transparent;font-size:14.5px}
.box-label{font-size:11px;font-weight:800;letter-spacing:1.3px;margin-bottom:6px;font-family:var(--serif)}
.box p{margin:0 0 6px;line-height:1.65}
.box p:last-child{margin-bottom:0}
.box ul{margin:6px 0 0;padding-left:20px}
.box li{margin-bottom:5px}
.box.rule{background:var(--brand-soft);border-color:#c8ddec}
.box.rule .box-label{color:var(--brand)}
.box.note{background:#f3f7fb;border-color:#dbe7f0}
.box.note .box-label{color:#3d6f9e}
.box.warn{background:var(--warn-bg);border-color:#e9dcb8}
.box.warn .box-label{color:var(--warn)}
.box.rem{background:#f5f2fa;border-color:#e2ddf0}
.box.rem .box-label{color:#5a4aa0}
.box.ext{background:#eef8f5;border-color:#d3ece3}
.box.ext .box-label{color:#2c7a60}
.box.ex{background:var(--paper-2);border-color:var(--line)}
.box.ex .box-label{color:var(--brand-2)}
.box.ex ul{margin:0;padding-left:20px}
.box.ex li{margin-bottom:5px;font-style:italic;color:var(--ink-2)}
table.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px;background:#fff;
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.tbl th{background:var(--paper-2);color:var(--ink);text-align:left;padding:10px 14px;
  font-size:12px;letter-spacing:1px;text-transform:uppercase;font-family:var(--serif);font-weight:700}
table.tbl td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top;line-height:1.55}
.tbl-wrap{overflow-x:auto}

/* ---- Quick Check ---- */
.qc{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 24px;margin:28px 0;
}
.qc h4{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);
  font-family:var(--sans);font-weight:800;margin:0 0 12px}
.qc .qc-q{font-family:var(--serif);font-size:16.5px;color:var(--ink);margin-bottom:14px;line-height:1.5}
.opt{
  display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:11px 16px;margin-bottom:8px;color:var(--ink);font-size:14.5px;
  transition:background .12s,border-color .12s,transform .1s;font-family:inherit;
}
.opt:hover:not([disabled]){background:var(--paper-2);border-color:var(--line-2)}
.opt[disabled]{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:#9fd9bb;color:#1d6b45;font-weight:600}
.opt.wrong{background:var(--bad-bg);border-color:#efc0be;color:#93332e;font-weight:600}
.feedback{border-radius:11px;padding:14px 18px;margin-top:14px;font-size:14.5px;line-height:1.6}
.feedback.ok{background:var(--ok-bg);border:1px solid #a9ddc4;color:#1d6b45}
.feedback.no{background:var(--bad-bg);border:1px solid #f0c8c6;color:#93332e}
.feedback .rule-line{margin-top:8px;font-size:13px;opacity:.9}

/* ---- Interactive widgets (kept, at bottom) ---- */
.iw-section{margin:44px 0 0;padding-top:30px;border-top:2px solid var(--line)}
.iw-section-head{margin-bottom:8px}
.iw-section-head .label{font-family:var(--serif);font-size:12px;letter-spacing:2.5px;
  color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:8px}
.iw-section-head h3{font-family:var(--serif);font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
.iw-section-head p{color:var(--ink-3);font-size:14px;margin:0 0 24px;max-width:640px}

.iwrap{
  background:linear-gradient(180deg,#fdfbf6,#faf6ee);
  border:1px solid var(--line);border-radius:16px;padding:22px;
  margin:0 0 18px;
}
.iwrap-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.iwrap-head .iw-ico{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;flex:0 0 auto;font-family:var(--serif);
}
.iwrap-head .iw-title{font-weight:700;color:var(--ink);font-size:14.5px;letter-spacing:.2px;line-height:1.2;font-family:var(--serif)}
.iwrap-head .iw-sub{font-size:11.5px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;font-weight:600;margin-top:2px}

.ifill-sent{font-size:17px;color:var(--ink);margin-bottom:16px;line-height:2;font-family:var(--serif)}
.ifill-sent .blank{
  display:inline-block;min-width:92px;border-bottom:2.5px dashed var(--brand-2);
  text-align:center;padding:0 10px;color:var(--brand);font-weight:700;margin:0 3px;
  font-family:var(--sans);transition:all .25s;
}
.ifill-sent .blank.ok{border-bottom-color:var(--ok);background:var(--ok-bg);color:#1d6b45;border-radius:4px}
.ifill-sent .blank.bad{border-bottom-color:var(--bad);background:var(--bad-bg);color:#93332e;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  padding:10px 20px;border:1.5px solid var(--line);border-radius:999px;
  background:#fff;color:var(--ink);font-size:14.5px;font-weight:600;
  transition:all .15s;font-family:inherit;
}
.chip:hover:not([disabled]){border-color:var(--brand-2);background:var(--brand-soft);transform:translateY(-1px)}
.chip.correct{background:var(--ok-bg);border-color:#9fd9bb;color:#1d6b45}
.chip.wrong{background:var(--bad-bg);border-color:#efc0be;color:#93332e}
.chip[disabled]{cursor:default}

.sort-pool{
  display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:12px;
  background:var(--paper-2);border-radius:12px;
  border:1.5px dashed var(--line-2);margin-bottom:14px;
}
.sort-pool:empty::after{content:"Tất cả đã được phân loại ✓";color:var(--ok);font-size:13px;font-style:italic;font-weight:600}
.sort-buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bucket{
  min-height:96px;padding:10px;border:1.5px dashed var(--line-2);
  border-radius:12px;background:#fff;transition:all .15s;
}
.bucket.active{border-color:var(--brand-2);background:var(--brand-soft);border-style:solid}
.bucket-title{
  font-size:12px;font-weight:800;color:var(--brand);text-align:center;
  margin-bottom:10px;text-transform:uppercase;letter-spacing:1.2px;font-family:var(--serif);
}
.bucket-items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sort-item{
  padding:7px 14px;background:#fff;border:1.5px solid var(--line);
  border-radius:999px;font-size:13.5px;font-weight:500;
  transition:all .15s;user-select:none;font-family:inherit;
}
.sort-item:hover{border-color:var(--brand-2);transform:translateY(-1px)}
.sort-item.selected{background:var(--brand-soft);border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(44,107,143,.18)}
.sort-item.correct{background:var(--ok-bg);border-color:#9fd9bb;color:#1d6b45;font-weight:700;cursor:default}
.sort-item.wrong{background:var(--bad-bg);border-color:#efc0be;color:#93332e;font-weight:700}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match-col{display:flex;flex-direction:column;gap:8px}
.match-cell{
  padding:11px 15px;border:1.5px solid var(--line);border-radius:10px;
  background:#fff;text-align:left;font-size:14.5px;font-weight:500;
  transition:all .15s;font-family:inherit;
}
.match-cell:hover:not([disabled]):not(.matched){border-color:var(--brand-2);background:var(--paper-2)}
.match-cell.selected{border-color:var(--brand-2);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(44,107,143,.18)}
.match-cell.matched{background:var(--ok-bg);border-color:#9fd9bb;color:#1d6b45;font-weight:600;cursor:default}
.match-cell.mismatch{background:var(--bad-bg);border-color:#efc0be;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.order-target{
  min-height:56px;padding:12px;background:var(--paper-2);
  border-radius:12px;border:1.5px dashed var(--line-2);margin-bottom:12px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;transition:all .2s;
}
.order-target:empty::after{content:"Nhấn vào từ bên dưới để sắp xếp câu...";color:var(--muted);font-size:13px;font-style:italic}
.order-target.ok{border-color:var(--ok);background:var(--ok-bg);border-style:solid}
.order-target.bad{border-color:var(--bad);background:var(--bad-bg);border-style:solid}
.order-pool{display:flex;flex-wrap:wrap;gap:8px}
.order-word{
  padding:8px 15px;background:#fff;border:1.5px solid var(--line);
  border-radius:8px;font-size:14.5px;font-weight:500;
  transition:all .15s;font-family:inherit;
}
.order-word:hover{border-color:var(--brand-2);background:var(--paper-2);transform:translateY(-1px)}
.order-word.in-target{background:var(--brand-soft);border-color:var(--brand-2);color:var(--brand)}

.iw-fb{margin-top:12px;padding:12px 16px;border-radius:11px;font-size:14px;animation:iwSlide .22s ease}
@keyframes iwSlide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.iw-fb.ok{background:var(--ok-bg);border:1px solid #a9ddc4;color:#1d6b45}
.iw-fb.no{background:var(--bad-bg);border:1px solid #f0c8c6;color:#93332e}
.iw-fb .rule-line{margin-top:6px;font-size:13px;opacity:.92}
.iw-score{
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px;
  background:#fff;border:1px solid var(--line);border-radius:999px;
  font-size:13px;color:var(--muted);font-weight:600;margin-top:12px;
}
.iw-score b{color:var(--brand);font-weight:800}
.iw-score.perfect{background:var(--ok-bg);border-color:#a9ddc4;color:#1d6b45}
.iw-score.perfect b{color:#1d6b45}

/* ---- Section footer nav ---- */
.section-foot{margin-top:52px;padding-top:26px;border-top:2px solid var(--line)}
.section-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chapter-nav{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chapter-nav .nav-card{
  display:flex;flex-direction:column;gap:4px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 20px;text-align:left;font-family:inherit;color:inherit;cursor:pointer;
  transition:all .15s;min-height:80px;
}
.chapter-nav .nav-card:hover{border-color:var(--brand-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.chapter-nav .nav-card.next{text-align:right;grid-column:2}
.chapter-nav .nav-card .nav-lb{font-size:11px;letter-spacing:2px;color:var(--gold);
  font-weight:800;text-transform:uppercase;font-family:var(--serif)}
.chapter-nav .nav-card .nav-title{font-family:var(--serif);font-size:16px;color:var(--ink);line-height:1.3}

/* ============ QUIZ PAGE ============ */
.quiz-shell{max-width:780px;margin:0 auto}
.quiz-head{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px}
.quiz-head .qt{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink);margin-bottom:4px}
.quiz-head .qm{font-size:12.5px;color:var(--muted);margin-bottom:12px;letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px 30px}
.qtext{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);margin-bottom:18px;line-height:1.5}
.qactions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.result-head{text-align:center;padding:34px 24px}
.score-big{font-family:var(--serif);font-size:56px;font-weight:700;color:var(--brand);line-height:1}
.rev-item{border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:12px;background:var(--card)}
.rev-item .rq{font-family:var(--serif);font-weight:600;color:var(--ink);margin-bottom:8px;font-size:15.5px;line-height:1.5}
.rev-item .line{font-size:14px;margin-bottom:4px;line-height:1.6}
.tag-ok{color:var(--ok);font-weight:700}
.tag-no{color:var(--bad);font-weight:700}

/* ============ PROGRESS / MISC ============ */
.empty{text-align:center;color:var(--muted);padding:44px 20px;font-style:italic;font-family:var(--serif)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.stat .l{font-family:var(--serif);font-size:11px;color:var(--gold);letter-spacing:1.8px;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.stat .v{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--ink);line-height:1.1}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.bar{height:8px;background:var(--paper-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-2),var(--brand));border-radius:99px;transition:width .3s}
.prog-row{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.prog-row .name{width:210px;flex:0 0 auto;font-size:14px;font-weight:600;font-family:var(--serif)}
.prog-row .bar{flex:1}
.prog-row .pct{width:52px;text-align:right;font-size:13.5px;color:var(--muted);font-weight:700;font-family:var(--serif)}
.list-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:12px}
.gloss{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:12px}
.gloss .term{font-family:var(--serif);font-weight:700;color:var(--brand);font-size:16px;margin-bottom:2px}
.gloss .vi{font-size:14px;margin:4px 0;color:var(--ink-2);line-height:1.6}
.gloss .exm{font-size:13.5px;color:var(--muted);font-style:italic;margin-top:6px}

/* ============ RESPONSIVE ============ */
@media (max-width:960px){
  .icon-btn{display:inline-flex}
  .layout{grid-template-columns:1fr}
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;width:290px;max-height:100%;
    transform:translateX(-103%);transition:transform .25s ease;z-index:260;
    box-shadow:0 0 40px rgba(23,40,58,.25);
  }
  #sidebar.open{transform:none}
  .brand-sub{display:none}
  .search{width:auto;flex:1;margin-left:0}
  main{padding:22px 20px 90px}
  .cover{padding:38px 26px 32px;border-radius:18px}
  .cover::before{width:6px}
  .cover-meta{gap:20px}
  .cover-meta .m-val{font-size:20px}
  .chapter-card{grid-template-columns:auto 1fr;gap:16px;padding:18px 20px}
  .chapter-card .ch-num{font-size:36px;min-width:56px}
  .chapter-card .ch-arrow{display:none}
  .chapter-card .ch-vi{font-size:19px}
  .reading-head h1{font-size:26px}
  .chapter-nav{grid-template-columns:1fr}
  .chapter-nav .nav-card.next{grid-column:1}
  .match-grid{grid-template-columns:1fr;gap:8px}
  .prog-row .name{width:120px;font-size:13px}
  table.tbl{font-size:13.5px}
  .concept-head{padding:16px 18px;gap:12px}
  .concept-body-inner{padding-left:18px;padding-right:18px}
  .concept-title{font-size:15.5px}
  .ifill-sent{font-size:15.5px}
}

/* =====================================================================
   3. STORAGE / STATE
   ===================================================================== */
const LS_KEY = "egram_book_v1";
function blankStore(){
  return { completed:{}, stats:{correct:0,incorrect:0}, practice:{}, mistakes:[], last:{view:"home"} };
}
let store = (function(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_KEY));
    if(raw && typeof raw === "object"){
      const b = blankStore();
      b.completed = raw.completed || {};
      b.stats = Object.assign({correct:0,incorrect:0}, raw.stats||{});
      b.practice = raw.practice || {};
      b.mistakes = Array.isArray(raw.mistakes) ? raw.mistakes : [];
      b.last = raw.last || {view:"home"};
      return b;
    }
  }catch(e){}
  return blankStore();
})();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }

const state = { view:"home", topicId:null, sectionId:null, quiz:null, qc:null, openConcepts:{} };

/* =====================================================================
   4. HELPERS
   ===================================================================== */
const $ = id => document.getElementById(id);
const mainEl = $("main");
const sidebarEl = $("sidebar");

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function letter(i){ return String.fromCharCode(65+i); }
function stripHtml(s){ return String(s).replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim(); }
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t = arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function findTopic(id){ return lessons.find(t=>t.id===id) || null; }
function findSection(topicId, sectionId){
  const t = findTopic(topicId);
  if(!t) return null;
  const s = t.sections.find(x=>x.id===sectionId);
  return s ? {topic:t, section:s} : null;
}
function secKey(topicId, sectionId){ return topicId + "/" + sectionId; }
function isDone(topicId, sectionId){ return !!store.completed[secKey(topicId,sectionId)]; }
function topicDone(topic){ return topic.sections.filter(s=>isDone(topic.id, s.id)).length; }
function topicPercent(topic){ return Math.round(topicDone(topic) / topic.sections.length * 100); }
function totalSections(){ return lessons.reduce((a,t)=>a+t.sections.length,0); }
function totalDone(){ return lessons.reduce((a,t)=>a+topicDone(t),0); }
function overallPercent(){ return Math.round(totalDone()/totalSections()*100); }
function accuracy(){
  const s = store.stats; const tot = s.correct + s.incorrect;
  return tot ? Math.round(s.correct/tot*100) : 0;
}
function topicAccuracy(topicId){
  const p = store.practice[topicId];
  if(!p) return null;
  const tot = p.correct + p.incorrect;
  return tot ? Math.round(p.correct/tot*100) : null;
}
function allQuestionsOfTopic(topic){
  const out = [];
  topic.sections.forEach(s=>{
    (s.questions||[]).forEach(q=>{
      out.push(Object.assign({}, q, {topicId:topic.id, sectionId:s.id, topicTitle:topic.title, sectionTitle:s.title}));
    });
  });
  return out;
}

/* --- Group blocks into concepts (click-to-reveal) --- */
function groupBlocks(blocks){
  const out = [];
  let cur = null;
  (blocks||[]).forEach(b=>{
    if(b.t === "h"){
      cur = { title: stripHtml(b.x), items: [] };
      out.push(cur);
    }else{
      if(!cur){ cur = { title: null, items: [] }; out.push(cur); }
      cur.items.push(b);
    }
  });
  return out;
}
function conceptPreview(items){
  for(const b of items){
    if(b.t === "p" && typeof b.x === "string") return stripHtml(b.x);
    if(b.t === "rule" || b.t === "note" || b.t === "rem" || b.t === "warn") return stripHtml(b.x);
    if(b.t === "ex" && Array.isArray(b.x) && b.x.length) return stripHtml(b.x[0]);
    if(b.t === "ul" && Array.isArray(b.x) && b.x.length) return stripHtml(b.x[0]);
    if(b.t === "tbl" && b.rows && b.rows.length) return stripHtml(b.rows[0].join(" · "));
  }
  return "";
}

/* =====================================================================
   5. SIDEBAR (Table of Contents)
   ===================================================================== */
function renderSidebar(){
  let h = "";
  h += '<div class="toc-label">Table of Contents</div>';
  h += '<button class="nav-item '+(state.view==="home"?"active":"")+'" data-nav="home">Cover &amp; Contents</button>';
  lessons.forEach(t=>{
    const active = state.topicId===t.id;
    h += '<div class="side-group">';
    h += '<button class="side-topic '+(active?"active":"")+'" data-nav="topic" data-topic="'+t.id+'">'+
         '<span class="num">'+esc(t.num)+'</span><span class="tx">'+esc(t.title)+'</span></button>';
    h += '<div class="side-subs">';
    t.sections.forEach(s=>{
      const cls = (state.topicId===t.id && state.sectionId===s.id) ? "side-sub active" : "side-sub";
      const tick = isDone(t.id,s.id) ? '<span class="tick">✓</span>' : "";
      h += '<button class="'+cls+'" data-nav="section" data-topic="'+t.id+'" data-section="'+s.id+'">'+
           '<span>'+esc(s.title)+'</span>'+tick+'</button>';
    });
    h += '</div></div>';
  });

function go(view, opts){
  opts = opts || {};
  if(view !== "quiz") state.quiz = null;
  state.view = view;
  state.topicId = opts.topicId || null;
  state.sectionId = opts.sectionId || null;
  store.last = {view:view, topicId:state.topicId, sectionId:state.sectionId};
  save();
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function openTopic(topicId){ go("topic", {topicId:topicId}); }
function openSection(topicId, sectionId){
  state.qc = null;

}

function render(){
  renderSidebar();

/* Reading progress bar */
function updateReadingProgress(){
  const bar = $("readBar");
  if(!bar) return;
  const scrollTop = window.scrollY || document.documentElement.scrollTop;
  const scrollMax = document.documentElement.scrollHeight - window.innerHeight;
  const pct = scrollMax > 0 ? Math.max(0, Math.min(100, (scrollTop / scrollMax) * 100)) : 0;
  bar.style.width = pct + "%";
}
window.addEventListener("scroll", updateReadingProgress, {passive:true});
window.addEventListener("resize", updateReadingProgress);

function renderBlocks(blocks){
  let h = "";
  blocks.forEach(b=>{
    if(b.t==="h") h += '<h3 class="bh">'+b.x+'</h3>';
    else if(b.t==="p") h += '<p>'+b.x+'</p>';
    else if(b.t==="ul") h += '<ul class="bul">'+b.x.map(i=>'<li>'+i+'</li>').join("")+'</ul>';
    else if(b.t==="ex") h += '<div class="box ex"><div class="box-label">Examples</div><ul>'+b.x.map(i=>'<li>'+i+'</li>').join("")+'</ul></div>';
    else if(b.t==="rule") h += '<div class="box rule"><div class="box-label">Rule</div><p>'+b.x+'</p></div>';
    else if(b.t==="note") h += '<div class="box note"><div class="box-label">Note</div><p>'+b.x+'</p></div>';
    else if(b.t==="warn") h += '<div class="box warn"><div class="box-label">Common Mistake</div><p>'+b.x+'</p></div>';
    else if(b.t==="rem") h += '<div class="box rem"><div class="box-label">Remember</div><p>'+b.x+'</p></div>';
    else if(b.t==="ext") h += '<div class="box ext"><div class="box-label">Extended</div><p>'+b.x+'</p></div>';

      h += '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+b.head.map(c=>'<th>'+c+'</th>').join("")+'</tr></thead><tbody>';
      b.rows.forEach(r=>{ h += '<tr>'+r.map(c=>'<td>'+c+'</td>').join("")+'</tr>'; });
      h += '</tbody></table></div>';
    }
  });
  return h;
}

/* =====================================================================
   Interactive widget rendering (fill / sort / match / order)
   ===================================================================== */
const IW_META = {
  fill : {icon:"✎", label:"Điền vào chỗ trống"},
  sort : {icon:"⇆", label:"Phân loại"},
  match: {icon:"⇄", label:"Nối cặp"},
  order: {icon:"≡", label:"Sắp xếp câu"}
};
state.iw = {};
function iwKey(topicId, sectionId, idx){ return topicId + "/" + sectionId + "|" + idx; }

function renderIW(block, topicId, sectionId, idx){
  const key = iwKey(topicId, sectionId, idx);
  const st = state.iw[key] || (state.iw[key] = initIWState(block));
  const meta = IW_META[block.t] || {icon:"✦", label:"Thực hành"};

  let h = '<div class="iwrap" data-iwkey="'+key+'">';
  h += '<div class="iwrap-head"><div class="iw-ico">'+meta.icon+'</div><div><div class="iw-title">'+meta.label+'</div>';
  if(block.q) h += '<div class="iw-sub">'+esc(block.q)+'</div>';
  h += '</div></div>';
  if(block.t==="fill")  h += renderIW_fill(block, st, key);
  if(block.t==="sort")  h += renderIW_sort(block, st, key);
  if(block.t==="match") h += renderIW_match(block, st, key);
  if(block.t==="order") h += renderIW_order(block, st, key);
  h += '</div>';
  return h;
}
function initIWState(b){
  if(b.t==="fill")  return { answered:false, chosen:null };
  if(b.t==="sort")  return { placed:{}, selected:null };
  if(b.t==="match") return { matched:{}, leftSel:null, mismatch:null };
  if(b.t==="order") return { target:[], pool:b.words.map((w,i)=>({w:w, id:i})), checked:null };
  return {};
}
function renderIW_fill(b, st, key){
  const parts = b.q.split("___");
  let sent = "";
  parts.forEach((p, i)=>{
    sent += esc(p);
    if(i < parts.length - 1){
      let cls = "blank", txt = "&nbsp;&nbsp;&nbsp;&nbsp;";
      if(st.answered){
        cls += st.chosen === b.a ? " ok" : " bad";
        txt = esc(b.o[st.answered ? st.chosen : b.a]);
        if(st.chosen !== b.a) txt = esc(b.o[st.chosen]) + " → " + esc(b.o[b.a]);
      }
      sent += '<span class="'+cls+'">'+txt+'</span>';
    }
  });
  let h = '<div class="ifill-sent">'+sent+'</div><div class="chips">';
  b.o.forEach((opt, i)=>{
    let cls = "chip";
    if(st.answered){ if(i === b.a) cls += " correct"; else if(i === st.chosen) cls += " wrong"; }
    const dis = st.answered ? " disabled" : "";
    h += '<button class="'+cls+'" data-iwact="fill-pick" data-idx="'+key+'" data-i="'+i+'"'+dis+'>'+esc(opt)+'</button>';
  });
  h += '</div>';
  if(st.answered){
    const ok = st.chosen === b.a;
    h += '<div class="iw-fb '+(ok?"ok":"no")+'">'+(ok?'<b>✓ Chính xác!</b>':'<b>✗ Chưa đúng.</b> Đáp án: <b>'+esc(b.o[b.a])+'</b>')+(b.rule?'<div class="rule-line"><b>Rule:</b> '+b.rule+'</div>':'')+'</div>';
  }
  return h;
}
function renderIW_sort(b, st, key){
  const placedSet = new Set(Object.keys(st.placed).map(Number));
  const pool = b.items.map((it,i)=>({text:it[0], cat:it[1], id:i})).filter(x=>!placedSet.has(x.id));
  let h = '<div class="sort-pool" data-iwact="sort-pool" data-idx="'+key+'">';
  pool.forEach(x=>{
    const sel = st.selected === x.id ? " selected" : "";
    h += '<button class="sort-item'+sel+'" data-iwact="sort-select" data-idx="'+key+'" data-id="'+x.id+'">'+esc(x.text)+'</button>';
  });
  h += '</div><div class="sort-buckets">';
  b.cats.forEach((cat, ci)=>{
    h += '<div class="bucket '+(st.selected!==null?"active":"")+'" data-iwact="sort-drop" data-idx="'+key+'" data-cat="'+ci+'">';
    h += '<div class="bucket-title">'+esc(cat)+'</div><div class="bucket-items">';
    Object.keys(st.placed).forEach(k=>{
      const id = Number(k);
      if(st.placed[id] === ci){
        const item = b.items[id];
        const correct = item[1] === ci;
        h += '<span class="sort-item '+(correct?"correct":"wrong")+'">'+esc(item[0])+'</span>';
      }
    });
    h += '</div></div>';
  });
  h += '</div>';
  const total = b.items.length;
  const placedCount = Object.keys(st.placed).length;
  const correctCount = Object.entries(st.placed).filter(([id,ci])=>b.items[Number(id)][1]===Number(ci)).length;
  h += '<div class="iw-score '+(placedCount===total && correctCount===total ? "perfect" : "")+'">'+
       '<span>Đã phân loại</span> <b>'+placedCount+' / '+total+'</b>'+
       (placedCount===total ? ' · <span>Đúng: <b>'+correctCount+' / '+total+'</b></span>' : '')+'</div>';
  return h;
}
function renderIW_match(b, st, key){
  if(!st._shuffled){
    const idx = b.pairs.map((_,i)=>i);
    let seed = 0; for(const ch of key) seed = (seed*31 + ch.charCodeAt(0)) & 0xffff;
    for(let i=idx.length-1;i>0;i--){
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      const j = seed % (i+1);
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
    st._shuffled = idx;
  }
  let h = '<div class="match-grid"><div class="match-col">';
  b.pairs.forEach((p, i)=>{
    const matched = !!st.matched[i];
    const cls = "match-cell" + (matched?" matched":"") + (st.leftSel === i?" selected":"") + (st.mismatch === i?" mismatch":"");
    h += '<button class="'+cls+'" data-iwact="match-left" data-idx="'+key+'" data-i="'+i+'"'+(matched?" disabled":"")+'>'+esc(p[0])+'</button>';
  });
  h += '</div><div class="match-col">';
  st._shuffled.forEach(ri=>{
    const matched = Object.values(st.matched).includes(ri);
    const cls = "match-cell" + (matched?" matched":"") + (st.mismatch === ri?" mismatch":"");
    h += '<button class="'+cls+'" data-iwact="match-right" data-idx="'+key+'" data-r="'+ri+'"'+(matched?" disabled":"")+'>'+esc(b.pairs[ri][1])+'</button>';
  });
  h += '</div></div>';
  const total = b.pairs.length;
  const done = Object.keys(st.matched).length;
  h += '<div class="iw-score '+(done===total?"perfect":"")+'">Đã nối <b>'+done+' / '+total+'</b>'+(done===total ? ' · <b>Hoàn thành! ✓</b>' : '')+'</div>';
  return h;
}
function renderIW_order(b, st, key){
  let h = '<div class="order-target '+(st.checked==="ok"?"ok":st.checked==="bad"?"bad":"")+'" data-iwact="order-target" data-idx="'+key+'">';
  st.target.forEach(t=>{
    h += '<button class="order-word in-target" data-iwact="order-remove" data-idx="'+key+'" data-tid="'+t.id+'">'+esc(t.w)+'</button>';
  });
  h += '</div><div class="order-pool">';
  st.pool.forEach(p=>{
    h += '<button class="order-word" data-iwact="order-add" data-idx="'+key+'" data-pid="'+p.id+'">'+esc(p.w)+'</button>';
  });
  h += '</div>';
  if(st.checked){
    const ok = st.checked === "ok";
    h += '<div class="iw-fb '+(ok?"ok":"no")+'">'+(ok ? '<b>✓ Câu đúng!</b>' : '<b>✗ Chưa đúng.</b> Đáp án: <b>'+esc(b.a)+'</b>')+'</div>';
  }
  return h;
}
function rerenderIW(key){
  const wrap = document.querySelector('[data-iwkey="'+key+'"]');
  if(!wrap) return;
  const [secPart, idxStr] = key.split("|");
  const blocks = interactiveContent[secPart] || [];
  const idx = parseInt(idxStr, 10);
  const b = blocks[idx];
  if(!b) return;
  const st = state.iw[key];
  let inner = "";
  if(b.t === "fill")  inner = renderIW_fill(b, st, key);
  if(b.t === "sort")  inner = renderIW_sort(b, st, key);
  if(b.t === "match") inner = renderIW_match(b, st, key);
  if(b.t === "order") inner = renderIW_order(b, st, key);
  const headEnd = wrap.innerHTML.indexOf('</div>', wrap.innerHTML.indexOf('iwrap-head')) + 6;
  const head = wrap.innerHTML.substring(0, headEnd);
  wrap.innerHTML = head + inner + '</div>';
}
function handleIWAction(el, ev){
  ev.preventDefault();
  const act = el.dataset.iwact;
  const key = el.dataset.idx;
  const st = state.iw[key];
  if(!st) return;

  if(act === "fill-pick"){
    if(st.answered) return;
    st.answered = true;
    st.chosen = parseInt(el.dataset.i, 10);
    rerenderIW(key); return;
  }
  if(act === "sort-select"){
    const id = parseInt(el.dataset.id, 10);
    st.selected = (st.selected === id) ? null : id;
    rerenderIW(key); return;
  }
  if(act === "sort-drop"){
    if(st.selected === null) return;
    st.placed[st.selected] = parseInt(el.dataset.cat, 10);
    st.selected = null;
    rerenderIW(key); return;
  }
  if(act === "sort-pool"){ st.selected = null; rerenderIW(key); return; }
  if(act === "match-left"){ st.leftSel = parseInt(el.dataset.i, 10); st.mismatch = null; rerenderIW(key); return; }
  if(act === "match-right"){
    if(st.leftSel === null) return;
    const ri = parseInt(el.dataset.r, 10);
    if(st.leftSel === ri){
      st.matched[st.leftSel] = ri;
      st.leftSel = null; st.mismatch = null;
      rerenderIW(key);
    }else{
      st.mismatch = ri;
      rerenderIW(key);
      setTimeout(()=>{ st.mismatch = null; st.leftSel = null; rerenderIW(key); }, 420);
    }
    return;
  }
  if(act === "order-add"){
    const pid = parseInt(el.dataset.pid, 10);
    const item = st.pool.find(p=>p.id===pid);
    if(!item) return;
    st.pool = st.pool.filter(p=>p.id!==pid);
    st.target.push(item);
    st.checked = null;
    rerenderIW(key);
    checkOrderAuto(key);
    return;
  }
  if(act === "order-remove"){
    const tid = parseInt(el.dataset.tid, 10);
    const item = st.target.find(t=>t.id===tid);
    if(!item) return;
    st.target = st.target.filter(t=>t.id!==tid);
    st.pool.push(item);
    st.checked = null;
    rerenderIW(key); return;
  }
}
function checkOrderAuto(key){
  const st = state.iw[key];
  if(!st || !st.target.length || st.pool.length) return;
  const [secPart, idxStr] = key.split("|");
  const blocks = interactiveContent[secPart] || [];
  const b = blocks[parseInt(idxStr, 10)];
  if(!b) return;
  const answer = st.target.map(t=>t.w).join(" ");
  st.checked = (answer === b.a) ? "ok" : "bad";
  if(st.checked === "bad"){
    rerenderIW(key);
    setTimeout(()=>{ st.checked = null; rerenderIW(key); }, 1400);
  }else{
    rerenderIW(key);
  }
}

function buildQuiz(rawQuestions, mode, title, meta){
  const prepared = shuffle(rawQuestions.slice()).map(q=>{
    const opts = q.o.map((text,i)=>({text:text, correct:i===q.a}));
    shuffle(opts);
    return {q:q.q, o:opts.map(x=>x.text), a:opts.findIndex(x=>x.correct), e:q.e, r:q.r,
      topicId:q.topicId, sectionId:q.sectionId, topicTitle:q.topicTitle, sectionTitle:q.sectionTitle};
  });
  return {mode:mode, title:title, meta:meta||"", questions:prepared, i:0,
    answers:new Array(prepared.length).fill(null), checked:false, finished:false};
}
function startTopicQuiz(topicId, mode){
  const t = findTopic(topicId);
  if(!t) return;
  const qs = allQuestionsOfTopic(t);
  if(!qs.length) return;
  state.quiz = buildQuiz(qs, mode||"practice", t.num+" — "+t.title, "topic");
  state.view = "quiz";
  save(); render(); window.scrollTo({top:0});
}
function startSectionQuiz(topicId, sectionId, mode){
  const f = findSection(topicId, sectionId);
  if(!f || !(f.section.questions||[]).length) return;
  const qs = f.section.questions.map(q=>Object.assign({},q,{topicId:topicId, sectionId:sectionId,
    topicTitle:f.topic.title, sectionTitle:f.section.title}));
  state.quiz = buildQuiz(qs, mode||"practice", f.topic.num+" · "+f.section.title, "section");
  state.view = "quiz";
  save(); render(); window.scrollTo({top:0});
}
function startMistakesQuiz(){
  if(!store.mistakes.length) return;
  const qs = store.mistakes.map(m=>({q:m.q, o:m.o.slice(), a:m.a, e:m.e, r:m.r,
    topicId:m.topicId, sectionId:m.sectionId, topicTitle:m.topicTitle, sectionTitle:m.sectionTitle}));
  state.quiz = buildQuiz(qs, "practice", "Mistakes Review", "mistakes");
  state.view = "quiz"; render(); window.scrollTo({top:0});
}
function recordAnswer(q, userIndex){
  const correct = userIndex === q.a;
  store.stats.correct += correct ? 1 : 0;
  store.stats.incorrect += correct ? 0 : 1;
  if(q.topicId){
    if(!store.practice[q.topicId]) store.practice[q.topicId] = {correct:0, incorrect:0};
    store.practice[q.topicId].correct += correct ? 1 : 0;
    store.practice[q.topicId].incorrect += correct ? 0 : 1;
  }
  const key = (q.topicId||"") + "::" + (q.sectionId||"") + "::" + q.q;
  if(correct){
    const idx = store.mistakes.findIndex(m=>((m.topicId||"")+"::"+(m.sectionId||"")+"::"+m.q) === key);
    if(idx >= 0) store.mistakes.splice(idx,1);
  }else{
    const existing = store.mistakes.find(m=>((m.topicId||"")+"::"+(m.sectionId||"")+"::"+m.q) === key);
    const entry = {q:q.q, o:q.o.slice(), a:q.a, user:userIndex, e:q.e, r:q.r,
      topicId:q.topicId, sectionId:q.sectionId, topicTitle:q.topicTitle, sectionTitle:q.sectionTitle};
    if(existing) Object.assign(existing, entry);
    else store.mistakes.push(entry);
  }
  save();
}
function renderQuiz(){

  const cur = q.questions[q.i];

    h += '<button class="'+cls+'" data-act="qopt" data-i="'+i+'"'+dis+'>'+letter(i)+'. '+opt+'</button>';

let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  lessons.forEach(t=>{
    t.sections.forEach(s=>{
      let text = s.title+" "+s.core+" ";
      s.blocks.forEach(b=>{
        if(b.t==="tbl"){
          text += b.head.join(" ")+" ";
          b.rows.forEach(r=>{ text += r.join(" ")+" "; });
        }else if(Array.isArray(b.x)){ text += b.x.join(" ")+" "; }
        else { text += b.x+" "; }
      });
      text += (s.questions||[]).map(q=>q.q+" "+q.o.join(" ")).join(" ");
      searchIndex.push({topicId:t.id, sectionId:s.id, title:s.title, topicTitle:t.title,
        text:text.replace(/<[^>]+>/g," ").toLowerCase()});
    });
  });
  glossary.forEach(g=>{
    searchIndex.push({topicId:null, sectionId:null, title:"Glossary: "+g.term, topicTitle:"Glossary",
      text:(g.term+" "+g.vi+" "+g.ex).toLowerCase()});
  });
  return searchIndex;
}
function doSearch(query){
  const box = $("searchResults");
  const q = query.trim().toLowerCase();
  if(q.length < 2){ box.classList.remove("show"); box.innerHTML=""; return; }
  const idx = buildSearchIndex();
  const results = idx.filter(item=>item.text.indexOf(q) !== -1).slice(0,12);
  if(!results.length){
    box.innerHTML = '<div class="sr-empty">Không tìm thấy kết quả cho “'+esc(query)+'”.</div>';
    box.classList.add("show"); return;
  }
  box.innerHTML = results.map((r,i)=>{
    const pos = r.text.indexOf(q);
    const from = Math.max(0, pos-45);
    let snippet = r.text.substring(from, pos+75);
    snippet = snippet.replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return '<div class="sr-item" data-sr="'+i+'" data-topic="'+(r.topicId||"")+'" data-section="'+(r.sectionId||"")+'">'+
           '<b>'+esc(r.title)+'</b><small>'+esc(r.topicTitle)+' — …'+snippet+'…</small></div>';
  }).join("");
  box.classList.add("show");
}

mainEl.addEventListener("click", function(e){
  /* Interactive widgets first */
  const iwEl = e.target.closest("[data-iwact]");
  if(iwEl){ handleIWAction(iwEl, e); return; }

  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  const topicId = el.dataset.topic;
  const sectionId = el.dataset.section;

  if(act==="home"){ go("home"); return; }
  if(act==="open-topic"){ openTopic(topicId); return; }
  if(act==="open-section"){ openSection(topicId, sectionId); return; }

  if(act==="mark-complete"){
    const k = secKey(topicId, sectionId);
    if(store.completed[k]) delete store.completed[k]; else store.completed[k] = true;
    save(); renderSectionPage(); renderSidebar();
    return;
  }

  if(act==="toggle-concept"){
    e.preventDefault();
    const card = el.closest(".concept");
    if(!card) return;
    card.classList.toggle("open");
    const idx = el.dataset.idx;
    const sk = secKey(state.topicId, state.sectionId) + "|" + idx;
    state.openConcepts[sk] = card.classList.contains("open");
    return;
  }
  if(act==="expand-all"){
    mainEl.querySelectorAll(".concept").forEach(c=>c.classList.add("open"));
    mainEl.querySelectorAll(".concept").forEach(c=>{
      const i = c.dataset.conceptIdx;
      state.openConcepts[secKey(state.topicId,state.sectionId) + "|" + i] = true;
    });
    return;
  }
  if(act==="collapse-all"){
    mainEl.querySelectorAll(".concept").forEach(c=>c.classList.remove("open"));
    mainEl.querySelectorAll(".concept").forEach(c=>{
      const i = c.dataset.conceptIdx;
      state.openConcepts[secKey(state.topicId,state.sectionId) + "|" + i] = false;
    });
    return;
  }

  if(act==="qc-opt"){
    const key = secKey(topicId, sectionId);
    if(state.qc && state.qc.key === key) return;
    state.qc = {key:key, chosen:parseInt(el.dataset.i,10)};
    const f = findSection(topicId, sectionId);
    if(f) $("qcBox").innerHTML = quickCheckHTML(f.topic, f.section);
    return;
  }

  if(act==="start-topic-quiz"){ startTopicQuiz(topicId, "practice"); return; }
  if(act==="start-topic-test"){ startTopicQuiz(topicId, "test"); return; }
  if(act==="start-section-quiz"){ startSectionQuiz(topicId, sectionId, "practice"); return; }

  const q = state.quiz;
  if(act==="qopt"){
    if(!q) return;
    if(q.mode==="practice" && q.checked) return;
    q.answers[q.i] = parseInt(el.dataset.i,10);
    renderQuiz(); return;
  }
  if(act==="quiz-check"){
    if(!q || q.answers[q.i]===null) return;
    q.checked = true;
    recordAnswer(q.questions[q.i], q.answers[q.i]);
    renderQuiz(); return;
  }
  if(act==="quiz-next"){
    if(!q || q.answers[q.i]===null) return;
    if(q.mode==="test") recordAnswer(q.questions[q.i], q.answers[q.i]);
    if(q.i < q.questions.length-1){ q.i++; q.checked = false; renderQuiz(); window.scrollTo({top:0,behavior:"smooth"}); }
    else { q.finished = true; renderQuiz(); window.scrollTo({top:0,behavior:"smooth"}); }
    return;
  }
  if(act==="quiz-finish"){ if(!q) return; q.finished = true; renderQuiz(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(act==="quiz-retry"){
    if(!q) return;
    if(q.meta==="mistakes"){ startMistakesQuiz(); }
    else{
      const sameMode = q.mode;
      if(q.meta==="topic"){ const t = findTopic(q.questions[0].topicId); if(t) startTopicQuiz(t.id, sameMode); }
      else if(q.meta==="section"){ const first = q.questions[0]; startSectionQuiz(first.topicId, first.sectionId, sameMode); }
      else{ go("practice"); }
    }
    return;
  }
  if(act==="quiz-quit"){ state.quiz = null; go("practice"); return; }
  if(act==="mistakes-practice"){ startMistakesQuiz(); return; }
  if(act==="clear-mistakes"){
    if(window.confirm("Xoá toàn bộ danh sách câu trả lời sai?")){ store.mistakes = []; save(); renderMistakesPage(); }
    return;
  }
  if(act==="reset-progress"){
    if(window.confirm("Bạn có chắc muốn xoá toàn bộ tiến độ học tập?")){
      store = blankStore(); save(); state.quiz = null; go("home");
    }
    return;
  }
});

/* Search */
const searchInput = $("searchInput");
const searchResults = $("searchResults");
searchInput.addEventListener("input", function(){ doSearch(this.value); });
searchInput.addEventListener("focus", function(){ if(this.value.trim().length>=2) doSearch(this.value); });
document.addEventListener("click", function(e){ if(!e.target.closest(".search")) searchResults.classList.remove("show"); });
searchResults.addEventListener("click", function(e){
  const item = e.target.closest(".sr-item");
  if(!item) return;
  const topicId = item.dataset.topic;
  const sectionId = item.dataset.section;
  searchResults.classList.remove("show");
  searchInput.value = "";
  if(topicId && sectionId) openSection(topicId, sectionId);
  else go("glossary");
});

/* Mobile menu */
$("menuBtn").addEventListener("click", function(){
  sidebarEl.classList.toggle("open");
  $("overlay").classList.toggle("show");
});
$("overlay").addEventListener("click", closeMobileMenu);

/* =====================================================================
   15. INIT
   ===================================================================== */
(function init(){
  const last = store.last || {view:"home"};
  if(last.view === "section" && last.topicId && last.sectionId && findSection(last.topicId, last.sectionId)){
    state.view = "section"; state.topicId = last.topicId; state.sectionId = last.sectionId;
  }else if(last.view === "topic" && findTopic(last.topicId)){
    state.view = "topic"; state.topicId = last.topicId;
  }else if(["home","practice","progress","mistakes","glossary"].indexOf(last.view) !== -1){
    state.view = last.view;
  }else{ state.view = "home"; }
  render();
})();
</script>
